<body>
<div class="app">
<header><div><h1 data-de="DFT & zyklische Fortsetzung" data-en="DFT & cyclic extension"></h1><p data-de="Warum nach dem letzten Sample wieder das erste kommt." data-en="Why the last sample is followed by the first."></p></div><div class="actions"><button id="language">English</button><button id="theme" data-de="Hell / Dunkel" data-en="Light / Dark"></button><button id="reset">Reset (R)</button></div></header>
<nav class="modes" aria-label="Dimension"><button id="mode1d" data-de="1D · DFT verstehen" data-en="1D · Understand the DFT"></button><button id="mode2d" data-de="2D · Bild, Faltung & Padding" data-en="2D · Image, convolution & padding"></button></nav>
<section id="oneD">
<nav class="steps" aria-label="DFT steps">
<button data-step="1"><b data-de="1 · Kontinuierlich" data-en="1 · Continuous"></b><small>g(x) ↔ G(f)</small></button>
<button data-step="2"><b data-de="2 · Im Ort abtasten" data-en="2 · Sample in space"></b><small>Δx ↔ f<sub>A</sub> = 1/Δx</small></button>
<button data-step="3"><b data-de="3 · Fenster auswählen" data-en="3 · Select a window"></b><small>N · Δx = L₀</small></button>
<button data-step="4"><b data-de="4 · Frequenzen abtasten" data-en="4 · Sample frequencies"></b><small>Δf = 1/L ↔ L = M · Δx</small></button>
</nav>
<div class="layout">
<aside>
<label class="control"><span data-de="Ausgangssignal" data-en="Source signal"></span><select id="preset"><option value="decay" data-de="Abklingendes Signal" data-en="Exponential decay"></option><option value="sine" data-de="Sinus" data-en="Sine wave"></option></select></label>
<label class="control" id="cyclesControl"><span><span data-de="Perioden im Datenblock" data-en="Cycles in data block"></span><output id="cyclesValue"></output></span><input id="cycles" type="range" min="0.5" max="12" step="0.1"></label>
<label class="control"><span><span data-de="Datenwerte N" data-en="Data samples N"></span><output id="countValue"></output></span><input id="count" type="range" min="8" max="64" step="1"></label>
<label class="control"><span><span data-de="Abtastabstand Δx" data-en="Sample spacing Δx"></span><output id="dxValue"></output></span><input id="dx" type="range" min="0.1" max="1" step="0.05"></label>
<p class="hint wide" id="sourceNote"></p>
<div class="wide" id="finalControls">
<hr><label class="control"><span><span data-de="Frequenzabtastung einblenden" data-en="Reveal frequency sampling"></span><output id="revealValue"></output></span><input id="reveal" type="range" min="0" max="100" step="1"></label>
<button id="animate" data-de="▶ Kopien entstehen lassen" data-en="▶ Reveal signal copies"></button>
<hr><h3 data-de="Über die Grenze wandern" data-en="Walk across the boundary"></h3>
<label class="control"><span><span data-de="Abtastcursor n" data-en="Sample cursor n"></span><output id="cursorValue"></output></span><input id="cursor" type="range" min="-1" max="33" step="1"></label>
<div class="actions"><button id="previous" aria-label="Previous sample">−1</button><button id="next" aria-label="Next sample">+1</button><button id="walk" data-de="▶ Cursor" data-en="▶ Cursor"></button></div>
</div>
<details class="wide" id="experiments"><summary data-de="Experimente" data-en="Experiments"></summary>
<p class="hint" data-de="Wirken ab Schritt 3; Zero-Padding ab Schritt 4." data-en="Active from step 3; zero-padding from step 4."></p>
<label class="control"><span data-de="Fenster" data-en="Window"></span><select id="window"><option value="rect" data-de="Rechteck" data-en="Rectangular"></option><option value="hann">Hann</option></select></label>
<label class="control"><span data-de="Zero-Padding" data-en="Zero-padding"></span><select id="padding"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option></select></label>
<div class="actions"><button id="integer" data-de="Sinus: 3 Perioden" data-en="Sine: 3 cycles"></button><button id="leakage" data-de="Sinus: 3,6 Perioden" data-en="Sine: 3.6 cycles"></button><button id="alias" data-de="Aliasing-Beispiel" data-en="Aliasing example"></button></div>
</details>
</aside>
<main>
<section class="info key" style="margin-top:0;margin-bottom:18px" aria-live="polite"><h2 id="stepTitle"></h2><p id="stepText"></p><p class="formula purple" id="stepFormula"></p></section>
<div class="views">
<section class="panel"><div class="panel-head"><h2 class="blue" data-de="Ortsraum" data-en="Spatial domain"></h2><p id="spaceSubtitle"></p></div><canvas id="space" role="img" aria-label="Spatial signal"></canvas><div class="panel-foot"><div class="legend"><span class="blue" data-de="Signal / Datenblock" data-en="Signal / data block"></span><span class="purple" data-de="Zyklische Kopien" data-en="Cyclic copies"></span><span class="orange" data-de="Cursor / Fensterrand" data-en="Cursor / window boundary"></span></div><p id="spaceNote"></p></div></section>
<section class="panel"><div class="panel-head"><h2 class="purple" data-de="Frequenzraum · Betrag" data-en="Frequency domain · magnitude"></h2><p id="frequencySubtitle"></p></div><canvas id="frequency" role="img" aria-label="Magnitude spectrum"></canvas><div class="panel-foot"><div class="legend"><span class="blue" data-de="Kontinuierliche Frequenzvariable" data-en="Continuous frequency variable"></span><span class="purple" data-de="DFT-Abtastwerte" data-en="DFT samples"></span></div><p id="frequencyNote"></p></div></section>
</div>
<section class="info"><div class="metrics" id="metrics"></div><p id="boundary" class="formula"></p><p id="experimentNote"></p></section>
<section class="info" id="basisSection"><label class="check"><input id="showBasis" type="checkbox"><b data-de="Synthese-Lupe: Alle DFT-Bausteine schließen sich" data-en="Synthesis lens: every DFT building block repeats"></b></label>
<div id="basisContent"><div class="basis-grid"><div><canvas id="basis" role="img" aria-label="DFT basis and synthesis"></canvas></div><div><label class="control"><span><span data-de="Basisindex k" data-en="Basis index k"></span><output id="harmonicValue"></output></span><input id="harmonic" type="range" min="0" max="31" step="1"></label><p class="hint" id="basisNote"></p></div></div><div class="legend"><span class="green" data-de="Vollständige Synthese (Realteil)" data-en="Complete synthesis (real part)"></span><span class="orange">Re{exp(i2πkn/M)} = cos(2πkn/M)</span></div><p class="formula">g̃[n] = (1/M) ∑<sub>k=0</sub><sup>M−1</sup> X[k] exp(i2πkn/M) &nbsp; ⇒ &nbsp; g̃[n+M] = g̃[n]</p><p class="hint" data-de="Die Formel ist die exakte IDFT an ganzzahligen n. Die grüne Verbindung dazwischen verwendet vorzeichenbehaftete Frequenzindizes (Nyquist als Cosinus); sie ist eine mögliche periodische Interpolation, kein wiedergewonnenes kontinuierliches Originalsignal." data-en="The formula is the exact IDFT at integer n. Between samples, the green curve uses signed frequency indices (Nyquist as a cosine); this is one possible periodic interpolation, not a recovered continuous original signal."></p></div></section>
<section class="info"><h2 data-de="Die entscheidende Unterscheidung" data-en="The crucial distinction"></h2><p data-de="Ortsabtastung → periodisches Spektrum. Frequenzabtastung → periodische Ortsfolge. Das reale Ausgangssignal muss dafür nicht periodisch sein." data-en="Spatial sampling → periodic spectrum. Frequency sampling → periodic spatial sequence. The real source signal does not have to be periodic."></p><p><strong data-de="Zyklisch heißt g̃[N] = g̃[0], nicht g[N−1] = g[0]." data-en="Cyclic means g̃[N] = g̃[0], not g[N−1] = g[0]."></strong> <span data-de="Mit Zero-Padding ist die Periode M statt N." data-en="With zero-padding, the period is M rather than N."></span></p>
<details><summary data-de="Mathematik & Darstellung" data-en="Mathematics & display conventions"></summary><ul>
<li data-de="Fourier-Konvention: exp(−i2πfx). Der Abtastkamm im Ort ist mit Δx gewichtet. Für die endliche Folge gilt S(f) = Δx ∑ g[n]w[n] exp(−i2πfnΔx). Das Diagramm zeigt |S(f)|; an den DFT-Stellen ist S(k/L) = Δx X[k]." data-en="Fourier convention: exp(−i2πfx). The spatial sampling comb is weighted by Δx. For the finite sequence, S(f) = Δx ∑ g[n]w[n] exp(−i2πfnΔx). The plot shows |S(f)|; at DFT frequencies S(k/L) = Δx X[k]."></li>
<li data-de="Exponentialsignal: exp(−x/2) für x ≥ 0, sonst 0; g[0] = 1. Schritt 1 zeigt den Betrag 2/√(1+(4πf)²), Schritt 2 die exakte unendliche geometrische Summe. Die Wahl des Wertes am Sprung beeinflusst die kontinuierliche FT nicht, die abgetastete Folge aber schon." data-en="Exponential signal: exp(−x/2) for x ≥ 0, otherwise 0; g[0] = 1. Step 1 shows magnitude 2/√(1+(4πf)²), step 2 the exact infinite geometric sum. The value assigned at the jump does not affect the continuous FT, but does affect the sampled sequence."></li>
<li data-de="Der unendlich ausgedehnte Sinus hat Dirac-Linien bei ±f₀. Deren Pfeilhöhen sind symbolische Gewichte, keine endlichen Funktionswerte. Bei zusammenfallenden Linien ist die komplexe Phase entscheidend; das Beispiel vermeidet solche Entartungen." data-en="The infinite sine has Dirac lines at ±f₀. Arrow heights represent symbolic weights, not finite function values. Coincident lines require their complex phases; the example avoids such degeneracies."></li>
<li data-de="Das Rechteckfenster umfasst N Abtastzellen von −Δx/2 bis (N−1/2)Δx. Hann: w[n] = (1−cos(2πn/(N−1)))/2. Zero-Padding hängt Nullen an, verändert die endliche Spektralkurve nicht und erhöht nicht die Auflösung naher Frequenzen." data-en="The rectangular window covers N sampling cells from −Δx/2 to (N−1/2)Δx. Hann: w[n] = (1−cos(2πn/(N−1)))/2. Zero-padding appends zeros, leaves the finite-sequence spectrum unchanged, and does not improve the resolution of nearby frequencies."></li>
<li data-de="Die gestrichelten Ortsverbindungen dienen nur als Lesehilfe für diskrete Werte. Die Frequenzansicht zeigt mehrere Perioden; der schattierte Bereich ist ein Nyquist-Intervall. Ein-/Ausblenden interpoliert nur die Deckkraft, nicht die Mathematik." data-en="Dashed spatial connections are guides between discrete values. The frequency view shows multiple periods; the shaded region is one Nyquist interval. Revealing changes only opacity, not the mathematics."></li>
</ul></details></section>
</main>
</div>
</section>
<section id="twoD" hidden>
<div class="layout">
<aside>
<label class="control"><span data-de="Kleines Bild · 16 × 16" data-en="Small image · 16 × 16"></span><select id="image2d"><option value="house" data-de="Häuschen am Rand" data-en="House at the edge"></option><option value="blocks" data-de="Helle Randmarken" data-en="Bright edge markers"></option><option value="impulse" data-de="Impuls in der Ecke" data-en="Impulse in the corner"></option></select></label>
<label class="control"><span data-de="Faltungskernel" data-en="Convolution kernel"></span><select id="filter2d"><option value="box" data-de="Mittelwert" data-en="Box average"></option><option value="gauss" data-de="Gauß (endlich)" data-en="Gaussian (finite)"></option><option value="motion" data-de="Horizontale Bewegung" data-en="Horizontal motion"></option></select></label>
<label class="control"><span><span data-de="Kernel-Kantenlänge K" data-en="Kernel side length K"></span><output id="size2dValue"></output></span><input id="size2d" type="range" min="3" max="11" step="2"></label>
<canvas id="kernel2d" role="img" aria-label="Kernel"></canvas>
<label class="control"><span><span data-de="Nullrand p · pro Seite" data-en="Zero border p · per side"></span><output id="pad2dValue"></output></span><input id="pad2d" type="range" min="0" max="6" step="1"></label>
<div class="actions wide"><button id="noPad" data-de="Ohne Padding" data-en="No padding"></button><button id="safePad" data-de="Genügend Padding" data-en="Enough padding"></button></div>
<hr class="wide"><label class="control"><span><span data-de="Ausgabepixel · Spalte x" data-en="Output pixel · column x"></span><output id="pixelXValue"></output></span><input id="pixelX" type="range" min="0" max="15" step="1"></label>
<label class="control"><span><span data-de="Ausgabepixel · Zeile y" data-en="Output pixel · row y"></span><output id="pixelYValue"></output></span><input id="pixelY" type="range" min="0" max="15" step="1"></label>
<p class="hint wide" data-de="Im gekachelten Bild oder einem Ergebnisbild klicken, um den Kernel zu verschieben. Orange: Kernel-Fußabdruck. Rot: aktive Zugriffe auf eine fremde Periode." data-en="Click the tiled image or a result image to move the kernel. Orange: kernel footprint. Red: active reads from another period."></p>
</aside>
<main>
<section class="info key" style="margin-top:0;margin-bottom:18px"><h2 data-de="DFT-Faltung sieht ein gekacheltes Bild" data-en="DFT convolution sees a tiled image"></h2><p data-de="Ohne Nullrand liegt am rechten Rand bereits die nächste Bildkopie. Der Kernel mischt sie in das Ergebnis hinein. Padding schiebt die Kopien auseinander; anschließend behalten wir nur das ursprüngliche Bildfenster." data-en="Without a zero border, the next image copy starts at the right edge. The kernel mixes it into the result. Padding moves copies apart; afterwards we keep only the original image window."></p><p class="formula purple">c = IDFT₂{DFT₂(g<sub>pad</sub>) · DFT₂(h<sub>0</sub>)} &nbsp; · &nbsp; M = 16 + 2p</p></section>
<section class="panel"><div class="panel-head"><h2 data-de="Periodische Eingabe & wandernder Kernel" data-en="Periodic input & travelling kernel"></h2><p data-de="Blau: ursprüngliches Bildfenster · Violett: DFT-Periode einschließlich Nullrand · Schwarz: Nullwerte" data-en="Blue: original image window · Purple: DFT period including zero border · Black: zero values"></p></div><canvas id="tiles2d" role="img" aria-label="Periodic image tiles and kernel"></canvas><div class="panel-foot"><p id="probe2d"></p></div></section>
<section class="info" aria-live="polite"><h2 id="paddingVerdict"></h2><p id="paddingExplanation"></p><div class="metrics" id="metrics2d"></div></section>
<div class="image-results" style="margin-top:18px">
<section class="panel"><div class="panel-head"><h2 class="purple" data-de="Zyklische DFT-Faltung" data-en="Cyclic DFT convolution"></h2><p data-de="Auf 16 × 16 beschnitten" data-en="Cropped to 16 × 16"></p></div><canvas id="cyclic2d" role="img" aria-label="Cyclic convolution crop"></canvas></section>
<section class="panel"><div class="panel-head"><h2 class="green" data-de="Lineare Referenz" data-en="Linear reference"></h2><p data-de="Außerhalb des Bildes überall null" data-en="Zero everywhere outside the image"></p></div><canvas id="linear2d" role="img" aria-label="Linear convolution crop"></canvas></section>
<section class="panel"><div class="panel-head"><h2 class="red" data-de="Wrap-around-Fehler" data-en="Wrap-around error"></h2><p data-de="|zyklisch − linear| · Rot ×4" data-en="|cyclic − linear| · red ×4"></p></div><canvas id="error2d" role="img" aria-label="Absolute wrap-around error"></canvas></section>
</div>
<section class="info"><h2 data-de="Warum eine halbe Kernelbreite pro Seite genügt" data-en="Why half a kernel width per side is enough"></h2><p class="formula">r = (K−1)/2 &nbsp; · &nbsp; p ≥ r &nbsp; ⇒ &nbsp; M = 16 + 2p ≥ 16 + K−1</p><p data-de="Für einen zentrierten Kernel mit ungerader Kantenlänge K ist r seine Reichweite. Ein Nullrand p ≥ r pro Seite hält jeden Kernelzugriff eines Originalpixels innerhalb der gepaddeten Periode. Die zyklische Faltung stimmt dann im gesamten ursprünglichen Bildfenster mit der linearen Faltung bei Nullfortsetzung überein." data-en="For a centered kernel of odd side length K, r is its reach. A zero border p ≥ r per side keeps every kernel read for an original pixel within the padded period. Cyclic convolution then matches zero-extended linear convolution throughout the original image window."></p><p class="hint" data-de="Gemeint ist der Same-Ausschnitt des Originalbildes. Die DFT-Periode bleibt zyklisch; sie ist jetzt groß genug, um die vollständige lineare Faltung ohne Überlagerung aufzunehmen. Der Kernel wird mit seinem Zentrum auf DFT-Index (0,0) gelegt; alle Rechnungen verwenden echte Faltung, keine Kreuzkorrelation. Die Bildhelligkeit ist in allen Ansichten fest auf [0,1] skaliert." data-en="This refers to the same-sized crop of the original image. The DFT period remains cyclic; it is now large enough to hold the full linear convolution without overlap. The kernel center is placed at DFT index (0,0); all calculations use true convolution, not cross-correlation. Image brightness uses a fixed [0,1] scale in every view."></p></section>
</main>
</div>
</section>
<section class="info"><div class="actions"><button id="copyLink" data-de="Zustandslink kopieren" data-en="Copy state link"></button><button id="save" data-de="Widget mit Zustand speichern" data-en="Save widget with state"></button><span class="pill" data-de="Offline · ohne Bibliotheken" data-en="Offline · no libraries"></span></div><p class="hint" data-de="← / →: 1D-Schritt wechseln · R: Reset · Regler mit Pfeiltasten bedienen. Im Bild oder Ortsplot klicken: Position setzen. Lokale Links gelten auf diesem Gerät; die gespeicherte HTML-Datei lässt sich weitergeben." data-en="← / →: change 1D step · R: reset · arrow keys operate sliders. Click an image or spatial plot to set the position. Local links work on this device; a saved HTML file can be shared."></p><input id="linkFallback" readonly hidden aria-label="State link"><p id="status" role="status" aria-live="polite"></p></section>
</div>
<script id="initialState" type="application/json">null</script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id), TAU = 2*Math.PI;
const defaults = {mode:'1d',image2d:'house',filter2d:'box',size2d:7,pad2d:0,pixelX:15,pixelY:8,step:1,preset:'decay',count:24,dx:0.25,cycles:3.6,window:'rect',padding:1,reveal:100,cursor:0,harmonic:1,showBasis:false,lang:'en',dark:true};
let state = {...defaults}, data, imageData, animation = null, walkTimer = null, queued = false;
const plots = {};
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
const mod = (n,m) => ((n%m)+m)%m;
const t = (de,en) => state.lang==='de'?de:en;
const fmt = (v,d=2) => (Math.abs(v)<1e-10?0:v).toLocaleString(state.lang==='de'?'de-DE':'en-US',{maximumFractionDigits:d});
function sanitize(input) {
 const s={...defaults,...input};
 for(const [key,min,max,step] of [['size2d',3,11,1],['pad2d',0,6,1],['pixelX',0,15,1],['pixelY',0,15,1],['step',1,4,1],['count',8,64,1],['dx',.1,1,.05],['cycles',.5,12,.1],['padding',1,4,1],['reveal',0,100,1],['cursor',-256,512,1],['harmonic',0,255,1]]){

 c.fillStyle=col('card');c.fillRect(0,0,w,h);c.font='14px system-ui';c.fillStyle=col('muted');
 for(let i=0;i<=4;i++){const y=ymin+(ymax-ymin)*i/4;c.strokeStyle=col('line');c.beginPath();c.moveTo(p.l,p.y(y));c.lineTo(p.r,p.y(y));c.stroke();c.textAlign='right';c.fillText(fmt(y,2),p.l-8,p.y(y)+5);}
 c.strokeStyle=col('muted');c.beginPath();c.moveTo(p.l,p.y(0));c.lineTo(p.r,p.y(0));c.stroke();c.textAlign='left';c.fillText(ylabel,p.l,17);c.textAlign='right';c.fillText(xlabel,p.r,h-8);plots[id]=p;return p;
}
function line(p,fn,color,alpha=1,dash=[]){const {c}=p;c.save();c.beginPath();c.rect(p.l,p.top,p.r-p.l,p.b-p.top);c.clip();c.strokeStyle=p.col(color);c.globalAlpha=alpha;c.lineWidth=2;c.setLineDash(dash);c.beginPath();const steps=Math.max(300,Math.round(p.r-p.l));for(let i=0;i<=steps;i++){const x=p.xmin+(p.xmax-p.xmin)*i/steps,y=fn(x);if(i===0)c.moveTo(p.x(x),p.y(y));else c.lineTo(p.x(x),p.y(y));}c.stroke();c.restore();}
function stem(p,x,y,color,alpha=1,r=3){if(x<p.xmin||x>p.xmax)return;const {c}=p;c.save();c.strokeStyle=c.fillStyle=p.col(color);c.globalAlpha=alpha;c.lineWidth=1.5;c.beginPath();c.moveTo(p.x(x),p.y(0));c.lineTo(p.x(x),p.y(y));c.stroke();c.beginPath();c.arc(p.x(x),p.y(y),r,0,TAU);c.fill();c.restore();}
function vertical(p,x,color,label,dash=[5,4],labelOffset=0){const {c}=p;c.save();c.strokeStyle=p.col(color);c.setLineDash(dash);c.beginPath();c.moveTo(p.x(x),p.top);c.lineTo(p.x(x),p.b);c.stroke();c.fillStyle=p.col(color);c.font='14px system-ui';c.textAlign='center';if(label)c.fillText(label,clamp(p.x(x),p.l+15,p.r-15),p.top+15+labelOffset);c.restore();}
function ticks(p,values){const {c}=p;c.fillStyle=p.col('muted');c.font='14px system-ui';c.textAlign='center';for(const [x,label] of values)c.fillText(label,p.x(x),p.h-25);}
function shade(p,a,b,color,alpha=.07){p.c.save();p.c.globalAlpha=alpha;p.c.fillStyle=p.col(color);p.c.fillRect(p.x(a),p.top,p.x(b)-p.x(a),p.b-p.top);p.c.restore();}
function drawSpace(){
 const final=state.step===4,period=final?data.L:data.L0,m=final?data.M:data.N;
 const p=plot('space',-1.08,2.08,-1.3,1.4,final?'x / L':'x / L₀','g');
 ticks(p,[[-1,'−1'],[0,'0'],[1,'1'],[2,'2']]);shade(p,-.5/m,1-.5/m,'blue');
 if(state.step===1)line(p,u=>source(u*period),'blue');
 if(state.step===2){line(p,u=>source(u*period),'blue',.35,[5,4]);for(let n=Math.ceil(p.xmin*m);n<=p.xmax*m;n++)if(state.preset==='sine'||n>=0)stem(p,n/m,source(n*data.dx),'blue');}
 if(state.step===3){line(p,u=>source(u*period),'blue',.18,[5,4]);for(let n=Math.ceil(p.xmin*m);n<=p.xmax*m;n++){if(n>=0&&n<data.N)stem(p,n/m,data.y[n],'blue');else if(state.preset==='sine'||n>=0)stem(p,n/m,source(n*data.dx),'blue',.14);}vertical(p,-.5/m,'orange','');vertical(p,(data.N-.5)/m,'orange','N');}
 if(final){
  const a=state.reveal/100;
  for(let block=-1;block<=2;block++){
   const alpha=block===0?1:a;if(!alpha)continue;
   const color=block===0?'blue':'purple';
   p.c.save();p.c.beginPath();p.c.rect(p.l,p.top,p.r-p.l,p.b-p.top);p.c.clip();p.c.globalAlpha=alpha*.55;p.c.strokeStyle=p.col(color);p.c.setLineDash([4,4]);p.c.beginPath();
   for(let j=0;j<=m;j++){const u=block+j/m;if(j===0)p.c.moveTo(p.x(u),p.y(data.y[0]));else p.c.lineTo(p.x(u),p.y(data.y[j%m]));}p.c.stroke();p.c.restore();
   for(let j=0;j<m;j++)stem(p,block+j/m,data.y[j],color,alpha,m>100?1.7:2.7);
  }
  vertical(p,0,'orange','0');vertical(p,1,'orange',`M = ${m}`);
  if(state.padding>1){shade(p,data.N/m-.5/m,1-.5/m,'muted',.12);vertical(p,(data.N-.5)/m,'muted',t('Nullen','zeros'));}
  const n=state.cursor,r=mod(n,m);vertical(p,n/m,'orange',`n=${n}`,[],22);stem(p,n/m,data.y[r],'orange',1,6);
  if(n!==r)stem(p,r/m,data.y[r],'orange',1,6);
 }
}
function drawFrequency(){
 const impulses=state.preset==='sine'&&state.step<3;
 const vals=Array.from({length:1001},(_,i)=>impulses?0:spectrum((-1.55+3.1*i/1000)/data.dx));
 const max=impulses?1.15:Math.max(...vals)*1.15;
 const p=plot('frequency',-1.55,1.55,0,max,'f / fA',impulses?t('Gewicht (symbolisch)','weight (symbolic)'):'|S|');
 if(state.step>=2)shade(p,-.5,.5,'purple',.08);
 ticks(p,[[-1,'−1'],[-.5,'−½'],[0,'0'],[.5,'½'],[1,'1']]);
 if(impulses){
  const u=state.cycles/data.N,lines=new Map();
  for(let j=state.step===1?0:-4;j<=(state.step===1?0:4);j++)for(const sign of [-1,1]){
   const x=j+sign*u;if(Math.abs(x)>1.55)continue;
   const key=x.toFixed(9),v=lines.get(key)||{x,re:0,im:0,original:false};
   v.re+=.5*Math.sin(.35);v.im-=sign*.5*Math.cos(.35);v.original ||= j===0;lines.set(key,v);
  }
  for(const v of lines.values()){
   const weight=Math.hypot(v.re,v.im),color=v.original?'blue':'purple';stem(p,v.x,weight,color,1,0);
   const c=p.c;c.fillStyle=p.col(color);c.beginPath();c.moveTo(p.x(v.x),p.y(weight)-5);c.lineTo(p.x(v.x)-5,p.y(weight)+7);c.lineTo(p.x(v.x)+5,p.y(weight)+7);c.fill();
  }
 }else{
  line(p,u=>spectrum(u/data.dx),'blue',state.step===4?.5:1,state.step===4?[5,4]:[]);
  if(state.step===4){const a=state.reveal/100;for(let k=Math.ceil(-1.55*data.M);k<=1.55*data.M;k++){const X=data.X[mod(k,data.M)];stem(p,k/data.M,data.dx*Math.hypot(X.re,X.im),'purple',a,data.M>100?1.5:2.7);}}
 }
 if(state.step>=2){vertical(p,-.5,'muted','');vertical(p,.5,'muted','');}
 if(state.step===4){p.c.fillStyle=p.col('purple');p.c.textAlign='left';p.c.fillText(`Δf / fA = 1/${data.M}`,p.l+8,p.top+18);}
}
function drawBasis(){if(state.step!==4||!state.showBasis)return;const max=Math.max(1.25,...data.y.map(Math.abs))*1.15,p=plot('basis',-.1,2.1,-max,max,'n / M','g̃, Re{basis}');ticks(p,[[0,'0'],[1,'1'],[2,'2']]);line(p,u=>synth(u*data.M),'green');line(p,u=>Math.cos(TAU*state.harmonic*u),'orange',.85,[5,4]);vertical(p,0,'purple','');vertical(p,1,'purple','');vertical(p,2,'purple','');for(let j=0;j<data.M;j++)stem(p,j/data.M,data.y[j],'blue',.5,2);}
function scheduleDraw(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;if(state.mode==='2d')draw2D();else{drawSpace();drawFrequency();drawBasis();}});}
function changeStep(step){stopAnimations();state.step=clamp(step,1,4);update(false);}
document.querySelectorAll('[data-step]').forEach(el=>el.addEventListener('click',()=>changeStep(Number(el.dataset.step))));
for(const key of ['preset','count','dx','cycles','window','padding','reveal','cursor','harmonic'])$(key).addEventListener('input',()=>{stopAnimations();state[key]=['preset','window'].includes(key)?$(key).value:Number($(key).value);update(!['reveal','cursor','harmonic'].includes(key));});
$('showBasis').addEventListener('change',()=>{state.showBasis=$('showBasis').checked;update(false);});
$('language').onclick=()=>{state.lang=state.lang==='de'?'en':'de';update(false);};
$('theme').onclick=()=>{state.dark=!state.dark;update(false);};
$('reset').onclick=()=>{stopAnimations();state={...defaults,mode:state.mode,lang:state.lang,dark:state.dark};$('status').textContent='';$('linkFallback').hidden=true;update();};
for(const [id,delta] of [['previous',-1],['next',1]])$(id).onclick=()=>{stopAnimations();state.cursor=clamp(state.cursor+delta,-data.M,2*data.M);update(false);};
$('walk').onclick=()=>{if(walkTimer!==null){stopAnimations();update(false);return;}stopAnimations();state.reveal=100;walkTimer=setInterval(()=>{state.cursor=state.cursor>=2*data.M?-data.M:state.cursor+1;update(false);},240);update(false);};
$('animate').onclick=()=>{
 if(animation!==null){stopAnimations();update(false);return;}stopAnimations();state.reveal=0;const start=performance.now();
 const tick=now=>{state.reveal=Math.round(clamp((now-start)/2800,0,1)*100);animation=state.reveal<100?requestAnimationFrame(tick):null;update(false);};animation=requestAnimationFrame(tick);update(false);
};
function experiment(kind){stopAnimations();state={...state,step:4,preset:'sine',count:24,cycles:kind==='integer'?3:3.6,window:'rect',padding:1,reveal:100,cursor:23};if(kind==='alias'){state.step=2;state.count=8;state.cycles=6.3;}update();}
for(const id of ['integer','leakage','alias'])$(id).onclick=()=>experiment(id);
$('space').addEventListener('pointerdown',e=>{if(state.step!==4)return;const p=plots.space,r=$('space').getBoundingClientRect(),u=p.xmin+(e.clientX-r.left-p.l)/(p.r-p.l)*(p.xmax-p.xmin);stopAnimations();state.cursor=clamp(Math.round(u*data.M),-data.M,2*data.M);update(false);});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.target.closest('input,select,button,summary'))return;if(e.key.toLowerCase()==='r')$('reset').click();if(state.mode==='1d'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();changeStep(state.step+(e.key==='ArrowRight'?1:-1));}});
$('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('status').textContent=t('Zustandslink kopiert.','State link copied.');}catch{$('linkFallback').hidden=false;$('linkFallback').value=location.href;$('linkFallback').focus();$('linkFallback').select();$('status').textContent=t('Link auswählen und kopieren.','Select and copy the link.');}};
$('save').onclick=()=>{const doc=document.documentElement.cloneNode(true);doc.querySelector('#initialState').textContent=JSON.stringify(state);doc.querySelector('#status').textContent='';doc.querySelector('#linkFallback').hidden=true;const blob=new Blob(['<!doctype html>\n'+doc.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='dft-cyclic-extension.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);$('status').textContent=t('HTML-Datei mit aktuellem Startzustand gespeichert.','HTML file saved with the current initial state.');};
document.querySelectorAll('main').forEach(el=>new ResizeObserver(scheduleDraw).observe(el));
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopAnimations();update(false);}});
update();
})();
</script>
</body>
