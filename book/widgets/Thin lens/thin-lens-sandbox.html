<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dünne Linse – Strahlengang und Bildsimulation</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --chip: #0b1220;
        --text: #e5eefb;
        --muted: #a8b5c9;
        --accent: #60a5fa;
        --accent-2: #34d399;
        --warn: #fbbf24;
        --danger: #f87171;
        --lens: #cbd5e1;
        --grid: rgba(148, 163, 184, 0.18);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(180deg, #0b1120 0%, #111827 100%);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        padding: 20px;
      }

      .app {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(1.4rem, 2vw, 2.2rem);
        letter-spacing: 0.02em;
      }

      .layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 18px;
      }

      .controls, .panel {
        background: rgba(17, 24, 39, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      }

      .controls {
        padding: 18px 16px 12px;
      }

      .control-group {
        margin-bottom: 16px;
      }

      .control-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .value {
        color: var(--text);
        font-weight: 700;
        min-width: 54px;
        text-align: right;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }

      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 12px;
        padding: 12px 10px;
        margin-top: 8px;
        font-size: 0.9rem;
        color: var(--text);
      }

      .toggle input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent-2);
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
      }

      .stat {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 10px;
        padding: 8px 10px;
      }

      .stat .label {
        display: block;
        font-size: 0.72rem;
        color: var(--muted);
      }

      .stat .number {
        display: block;
        margin-top: 4px;
        font-weight: 700;
        font-size: 1.05rem;
      }

      .main {
        display: grid;
        gap: 16px;
      }

      .panel {
        padding: 10px;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 12px;
        background: linear-gradient(180deg, #0b1220 0%, #0f172a 100%);
      }

      .bottom {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .labelled {
        margin-top: 8px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.02em;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <h1>Dünne Linse – Strahlengang & Bildsimulation</h1>

      <div class="layout">
        <aside class="controls">
          <div class="control-group">
            <div class="control-header">
              <span>Brennweite f</span>
              <span class="value" id="fValue">60</span>
            </div>
            <input id="f" type="range" min="20" max="140" step="1" value="60" />
          </div>

          <div class="control-group">
            <div class="control-header">
              <span>Objektabstand g</span>
              <span class="value" id="gValue">120</span>
            </div>
            <input id="g" type="range" min="50" max="220" step="1" value="120" />
          </div>

          <div class="control-group">
            <div class="control-header">
              <span>Bildabstand b</span>
              <span class="value" id="bValue">90</span>
            </div>
            <input id="b" type="range" min="20" max="220" step="1" value="90" />
          </div>

          <div class="control-group">
            <div class="control-header">
              <span>Blendendurchmesser d</span>
              <span class="value" id="dValue">18</span>
            </div>
            <input id="d" type="range" min="4" max="40" step="1" value="18" />
          </div>

          <div class="control-group">
            <div class="control-header">
              <span>Sensorposition</span>
              <span class="value" id="sensorValue">0</span>
            </div>
            <input id="sensorShift" type="range" min="-60" max="60" step="1" value="0" />
          </div>

          <label class="toggle">
            <span>Zerstreuungskreis vs. Pixelgröße</span>
            <input id="pixelToggle" type="checkbox" />
          </label>

          <div class="stats">
            <div class="stat">
              <span class="label">Vergrößerung V</span>
              <span class="number" id="vStat">1.00×</span>
            </div>
            <div class="stat">
              <span class="label">Zerstreuung Ø</span>
              <span class="number" id="blurStat">0.0</span>
            </div>
            <div class="stat">
              <span class="label">Bildabstand</span>
              <span class="number" id="bIdealStat">0</span>
            </div>
            <div class="stat">
              <span class="label">Pixelgrenze</span>
              <span class="number" id="pixelStat">8.0</span>
            </div>
          </div>
        </aside>

        <main class="main">
          <section class="panel">
            <canvas id="opticsCanvas" width="900" height="420"></canvas>
          </section>

          <section class="bottom">
            <div class="panel">
              <canvas id="objectCanvas" width="420" height="220"></canvas>
              <div class="labelled">Testmotiv im Objekt</div>
            </div>
            <div class="panel">
              <canvas id="imageCanvas" width="420" height="220"></canvas>
              <div class="labelled">Resultierendes Bild am Sensor</div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script>
      const state = {
        f: 60,
        g: 120,
        b: 90,
        d: 18,
        sensorShift: 0,
        pixelMode: false,
        pixelSize: 8
      };

      const els = {
        f: document.getElementById('f'),
        g: document.getElementById('g'),
        b: document.getElementById('b'),
        d: document.getElementById('d'),
        sensorShift: document.getElementById('sensorShift'),
        pixelToggle: document.getElementById('pixelToggle'),
        fValue: document.getElementById('fValue'),
        gValue: document.getElementById('gValue'),
        bValue: document.getElementById('bValue'),
        dValue: document.getElementById('dValue'),
        sensorValue: document.getElementById('sensorValue'),
        vStat: document.getElementById('vStat'),
        blurStat: document.getElementById('blurStat'),
        bIdealStat: document.getElementById('bIdealStat'),
        pixelStat: document.getElementById('pixelStat')
      };

      const opticsCanvas = document.getElementById('opticsCanvas');
      const opticsCtx = opticsCanvas.getContext('2d');

      const objectCanvas = document.getElementById('objectCanvas');
      const objectCtx = objectCanvas.getContext('2d');

      const imageCanvas = document.getElementById('imageCanvas');
      const imageCtx = imageCanvas.getContext('2d');

      const motifCanvas = document.createElement('canvas');
      motifCanvas.width = 260;
      motifCanvas.height = 180;
      const motifCtx = motifCanvas.getContext('2d');

      function updateStateFromInputs() {
        state.f = Number(els.f.value);
        state.g = Number(els.g.value);
        state.b = Number(els.b.value);
        state.d = Number(els.d.value);
        state.sensorShift = Number(els.sensorShift.value);
        state.pixelMode = els.pixelToggle.checked;
      }

      function bindInputs() {
        [els.f, els.g, els.b, els.d, els.sensorShift].forEach((el) => {
          el.addEventListener('input', () => {
            updateStateFromInputs();
            render();
          });
        });

        els.pixelToggle.addEventListener('change', () => {
          updateStateFromInputs();
          render();
        });
      }

      function createMotif() {
        motifCtx.clearRect(0, 0, motifCanvas.width, motifCanvas.height);

        // Background
        motifCtx.fillStyle = '#e2e8f0';
        motifCtx.fillRect(0, 0, motifCanvas.width, motifCanvas.height);

        // Draw a stylized object: large central block, bars, circle, and some test structure.
        motifCtx.fillStyle = '#0f172a';
        motifCtx.fillRect(54, 32, 132, 116);

        motifCtx.fillStyle = '#f8fafc';
        motifCtx.fillRect(76, 52, 88, 76);

        motifCtx.fillStyle = '#0f172a';
        motifCtx.fillRect(108, 46, 24, 88);
        motifCtx.fillRect(74, 82, 112, 16);

        motifCtx.beginPath();
        motifCtx.fillStyle = '#1d4ed8';
        motifCtx.arc(180, 90, 24, 0, Math.PI * 2);
        motifCtx.fill();

        motifCtx.fillStyle = '#0f172a';
        motifCtx.fillRect(190, 52, 18, 78);
        motifCtx.fillRect(170, 80, 60, 12);

        motifCtx.strokeStyle = '#0f172a';
        motifCtx.lineWidth = 3;
        motifCtx.beginPath();
        motifCtx.moveTo(28, 150);
        motifCtx.lineTo(230, 150);
        motifCtx.moveTo(32, 22);
        motifCtx.lineTo(32, 150);
        motifCtx.stroke();
      }

      function computeIdealImageDistance() {
        const denom = 1 / state.f - 1 / state.g;
        if (Math.abs(denom) < 1e-9) return Number.POSITIVE_INFINITY;
        return 1 / denom;
      }

      function getSensorPlane() {
        return state.b + state.sensorShift;
      }

      function computeMagnification() {
        const actualB = getSensorPlane();
        return actualB / state.g;
      }

      function computeBlurDiameter() {
        const bIdeal = computeIdealImageDistance();
        if (!Number.isFinite(bIdeal) || bIdeal <= 0) return 0;
        const actualB = getSensorPlane();
        const defocus = Math.abs(actualB - bIdeal);
        return (state.d * defocus) / Math.max(1, bIdeal);
      }

      function computeDepthOfFieldRange() {
        const bIdeal = computeIdealImageDistance();
        if (!Number.isFinite(bIdeal) || bIdeal <= 0) return null;

        const pixelThreshold = Math.max(1, state.pixelSize);
        const results = [];

        for (let g = 35; g <= 300; g += 1) {
          const denom = 1 / state.f - 1 / g;
          if (Math.abs(denom) < 1e-9) continue;
          const bFocus = 1 / denom;
          const blurDiameter = (state.d * Math.abs(bFocus - bIdeal)) / Math.max(1, bIdeal);
          if (blurDiameter <= pixelThreshold) {
            results.push(g);
          }
        }

        if (results.length === 0) return null;
        return [Math.min(...results), Math.max(...results)];
      }

      function mapX(x, min, max, width, pad = 30) {
        const domain = max - min || 1;
        return pad + ((x - min) / domain) * (width - 2 * pad);
      }

      function drawLensAperture(ctx, lensX, axisY, radius) {
        ctx.beginPath();
        ctx.arc(lensX, axisY, radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(148, 163, 184, 0.14)';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#dbeafe';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(lensX, axisY, radius * 0.66, 0, Math.PI * 2);
        ctx.fillStyle = '#0b1220';
        ctx.fill();
      }

      function drawGuides(ctx, width, height, objectX, sensorX, lensX, bIdeal) {
        ctx.clearRect(0, 0, width, height);

        const axisY = height * 0.65;
        const xMin = 20;
        const xMax = width - 20;
        const actualB = getSensorPlane();
        const focusX = lensX + Math.max(50, state.f * 2.2);
        const apertureRadius = Math.max(8, state.d * 0.9);

        ctx.fillStyle = '#0b1220';
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = 'rgba(148,163,184,0.12)';
        ctx.lineWidth = 1;
        for (let x = 0; x <= width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let y = 0; y <= height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(xMin, axisY);
        ctx.lineTo(xMax, axisY);
        ctx.stroke();

        ctx.fillStyle = '#e2e8f0';
        ctx.font = '12px Segoe UI';
        ctx.fillText('Optische Achse', 30, axisY - 10);

        ctx.strokeStyle = 'rgba(96,165,250,0.85)';
        ctx.setLineDash([7, 6]);
        ctx.beginPath();
        ctx.moveTo(objectX, 24);
        ctx.lineTo(objectX, height - 18);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#60a5fa';
        ctx.fillText('Objekt ebene', objectX + 8, 22);

        if (Number.isFinite(bIdeal)) {
          const focusPlaneX = lensX + bIdeal * 2.1;
          ctx.strokeStyle = 'rgba(52,211,153,0.95)';
          ctx.setLineDash([4, 6]);
          ctx.beginPath();
          ctx.moveTo(focusPlaneX, 24);
          ctx.lineTo(focusPlaneX, height - 18);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = '#34d399';
          ctx.fillText('Brennebene', focusPlaneX + 8, 52);
        }

        ctx.strokeStyle = 'rgba(250,204,21,0.9)';
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(sensorX, 24);
        ctx.lineTo(sensorX, height - 18);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#fbbf24';
        ctx.fillText('Sensor', sensorX + 8, 38);

        ctx.strokeStyle = '#dfe7f3';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(lensX, axisY - 60);
        ctx.lineTo(lensX, axisY + 60);
        ctx.stroke();
        drawLensAperture(ctx, lensX, axisY, apertureRadius);
        ctx.fillStyle = '#dfe7f3';
        ctx.fillText('Linse', lensX + 10, axisY + 4);

        const objHeight = 52;
        const pointTop = axisY - objHeight;
        const pointBottom = axisY + objHeight;
        const v = computeMagnification();
        const imageHeight = objHeight * Math.abs(v);
        const imageTopY = axisY - imageHeight;
        const imageBottomY = axisY + imageHeight;
        const blurDiameter = computeBlurDiameter();
        const blurRadius = blurDiameter / 2;

        ctx.fillStyle = '#60a5fa';
        ctx.beginPath();
        ctx.arc(objectX, pointTop, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(objectX, pointTop);
        ctx.lineTo(lensX, pointTop);
        ctx.lineTo(sensorX, imageTopY);
        ctx.stroke();

        ctx.strokeStyle = '#60a5fa';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(objectX, pointBottom);
        ctx.lineTo(lensX, pointBottom);
        ctx.lineTo(sensorX, imageBottomY);
        ctx.stroke();

        for (let y = axisY - 42; y <= axisY + 42; y += 18) {
          const yNorm = (y - axisY) / 42;
          const startX = xMin;
          const endX = lensX;
          const lineY = y;

          ctx.strokeStyle = 'rgba(96,165,250,0.55)';
          ctx.beginPath();
          ctx.moveTo(startX, lineY);
          ctx.lineTo(endX, lineY);
          ctx.stroke();

          ctx.strokeStyle = 'rgba(96,165,250,0.7)';
          ctx.beginPath();
          ctx.moveTo(lensX, lineY);
          ctx.lineTo(focusX, axisY + yNorm * 18);
          ctx.stroke();
        }

        ctx.fillStyle = '#f87171';
        ctx.beginPath();
        ctx.arc(focusX, axisY, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f87171';
        ctx.fillText('F', focusX + 8, axisY - 10);

        ctx.strokeStyle = 'rgba(248,113,113,0.9)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(sensorX, axisY, blurRadius * 2.3, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = '#f8fafc';
        ctx.font = '600 13px Segoe UI';
        ctx.fillText(`f = ${state.f}`, 30, height - 28);
        ctx.fillText(`g = ${state.g}`, 120, height - 28);
        ctx.fillText(`b = ${actualB.toFixed(1)}`, 210, height - 28);
        ctx.fillText(`d = ${state.d}`, 300, height - 28);

        const vText = `V = ${computeMagnification().toFixed(2)}×`;
        ctx.fillText(vText, 390, height - 28);

        if (state.pixelMode) {
          const depth = computeDepthOfFieldRange();
          if (depth) {
            const x0 = mapX(depth[0], 35, 300, width, 20);
            const x1 = mapX(depth[1], 35, 300, width, 20);
            ctx.fillStyle = 'rgba(52,211,153,0.16)';
            ctx.fillRect(x0, 40, x1 - x0, height - 80);
            ctx.fillStyle = '#34d399';
            ctx.fillText('Schärfentiefe', x0 + 10, 60);
          }
        }

        const diameterText = `Ø = ${blurDiameter.toFixed(2)}`;
        ctx.fillStyle = '#fca5a5';
        ctx.fillText(diameterText, sensorX + 14, axisY + blurRadius * 2.3 + 16);
      }

      function drawObjectCanvas() {
        const w = objectCanvas.width;
        const h = objectCanvas.height;
        objectCtx.clearRect(0, 0, w, h);

        objectCtx.fillStyle = '#0b1220';
        objectCtx.fillRect(0, 0, w, h);

        const dx = w * 0.16;
        const dy = h * 0.18;
        objectCtx.drawImage(motifCanvas, dx, dy, w - dx * 2, h - dy * 2);

        objectCtx.strokeStyle = 'rgba(96,165,250,0.85)';
        objectCtx.setLineDash([7, 6]);
        objectCtx.beginPath();
        objectCtx.moveTo(18, 18);
        objectCtx.lineTo(18, h - 18);
        objectCtx.stroke();
        objectCtx.setLineDash([]);
        objectCtx.fillStyle = '#60a5fa';
        objectCtx.fillText('Objekt', 26, 26);
      }

      function drawImageCanvas() {
        const w = imageCanvas.width;
        const h = imageCanvas.height;
        imageCtx.clearRect(0, 0, w, h);
        imageCtx.fillStyle = '#0b1220';
        imageCtx.fillRect(0, 0, w, h);

        const v = Math.abs(computeMagnification());
        const baseScale = Math.max(0.4, Math.min(1.6, v * 0.9));
        const drawW = motifCanvas.width * baseScale;
        const drawH = motifCanvas.height * baseScale;
        const x = (w - drawW) / 2;
        const y = (h - drawH) / 2;
        const blurPx = Math.max(0, computeBlurDiameter() * 2.2);

        imageCtx.save();
        imageCtx.translate(w / 2, h / 2);
        imageCtx.filter = `blur(${blurPx}px)`;
        imageCtx.drawImage(motifCanvas, -drawW / 2, -drawH / 2, drawW, drawH);
        imageCtx.restore();

        imageCtx.strokeStyle = 'rgba(250,204,21,0.8)';
        imageCtx.setLineDash([5, 5]);
        imageCtx.strokeRect(x - 4, y - 4, drawW + 8, drawH + 8);
        imageCtx.setLineDash([]);

        imageCtx.fillStyle = '#fbbf24';
        imageCtx.fillText('Sensorbild', 18, 24);
      }

      function updateStatDisplay() {
        const bIdeal = computeIdealImageDistance();
        const blurDiameter = computeBlurDiameter();
        const v = computeMagnification();

        els.fValue.textContent = state.f.toFixed(0);
        els.gValue.textContent = state.g.toFixed(0);
        els.bValue.textContent = state.b.toFixed(0);
        els.dValue.textContent = state.d.toFixed(0);
        els.sensorValue.textContent = `${state.sensorShift.toFixed(0)} px`;

        els.vStat.textContent = `${v.toFixed(2)}×`;
        els.blurStat.textContent = `${blurDiameter.toFixed(2)}`;
        els.bIdealStat.textContent = `${Number.isFinite(bIdeal) ? bIdeal.toFixed(1) : '∞'}`;
        els.pixelStat.textContent = `${state.pixelSize.toFixed(1)}`;
      }

      function render() {
        updateStateFromInputs();
        updateStatDisplay();

        const bIdeal = computeIdealImageDistance();
        const actualB = getSensorPlane();
        const lensX = opticsCanvas.width * 0.46;
        const objectX = lensX - state.g * 2.1;
        const sensorX = lensX + actualB * 2.1;

        drawGuides(opticsCtx, opticsCanvas.width, opticsCanvas.height, objectX, sensorX, lensX, bIdeal);
        drawObjectCanvas();
        drawImageCanvas();
      }

      createMotif();
      bindInputs();
      render();
    </script>
  </body>
</html>
