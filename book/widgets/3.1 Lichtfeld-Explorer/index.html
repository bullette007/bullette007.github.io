<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light field explorer</title>
<style>
:root{color-scheme:light;--bg:#eef3f8;--card:#fff;--line:#cbd6e2;--text:#172334;--muted:#526579;--blue:#1769aa;--purple:#7048c8;--orange:#a95000;--green:#16704d}
:root.dark{color-scheme:dark;--bg:#08111f;--card:#101c2d;--line:#2a3b52;--text:#edf4ff;--muted:#a8b9ce;--blue:#75baff;--purple:#bb9aff;--orange:#ffad57;--green:#77deb1}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:clamp(10px,2vw,28px);background:var(--bg);color:var(--text);font:18px/1.45 system-ui,"Segoe UI",sans-serif}.app{max-width:1640px;margin:auto}header,.actions,.presets{display:flex;flex-wrap:wrap;align-items:center;gap:10px}header{justify-content:space-between;margin-bottom:18px}h1{font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:-.04em;margin:0}h2{font-size:1.15rem;margin:0}p{margin:8px 0}.hint,small{color:var(--muted);font-size:.95rem}button,input{font:inherit}button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-height:44px;cursor:pointer}button:hover,button[aria-pressed=true]{border-color:var(--purple)}button[aria-pressed=true]{box-shadow:inset 0 0 0 1px var(--purple)}:focus-visible{outline:3px solid var(--purple);outline-offset:3px}input[type=range]{width:100%;accent-color:var(--purple);min-height:30px}input[type=checkbox]{width:21px;height:21px;accent-color:var(--orange);vertical-align:middle}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:18px}.control,.panel,.info{background:var(--card);border:1px solid var(--line);border-radius:15px}.control{padding:15px}label.slider{display:block;margin:10px 0}.slider>span{display:flex;justify-content:space-between;gap:8px;font-weight:650}output{color:var(--purple);white-space:nowrap}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.panel{min-width:0;overflow:hidden}.panel-head{padding:15px;border-bottom:1px solid var(--line);min-height:120px}.panel-body{padding:14px}.image{position:relative;background:#121b28;border-radius:6px;overflow:hidden}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.image canvas.overlay{position:absolute;inset:0;width:100%;height:100%}#rawOverlay,#saiOverlay{cursor:crosshair;touch-action:none}.caption{font-size:.94rem;color:var(--muted);min-height:70px;margin:10px 0}.lens-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin:12px auto;max-width:340px}.lens-grid button{padding:0;min-height:32px;aspect-ratio:1;border-radius:4px;position:relative}.lens-grid button[aria-pressed=true]{outline:3px solid var(--orange);outline-offset:0;z-index:1}.lens-grid button.center:after{content:'+';color:white;text-shadow:0 1px 3px #000;position:absolute;inset:0;display:grid;place-items:center}.formula{font:clamp(.85rem,1.4vw,1.05rem)/1.7 ui-monospace,Consolas,monospace;overflow-wrap:anywhere;padding:12px;background:var(--bg);border-radius:8px}.info{padding:16px 18px;margin-top:18px}.orange{color:var(--orange)}.green{color:var(--green)}.blue{color:var(--blue)}.presets{margin:12px 0}.presets button{font-size:1rem;padding:6px 10px}.metrics{color:var(--green);font-weight:650}#linkFallback{width:100%;margin-top:12px}summary{cursor:pointer}li{margin:8px 0}.observation{border-left:4px solid var(--purple)}
#rawOverlay,#saiOverlay{position:absolute;inset:0;width:100%;height:100%}
@media(max-width:1150px){.controls{grid-template-columns:repeat(2,minmax(0,1fr))}.panels{grid-template-columns:repeat(2,minmax(0,1fr))}.panel:last-child{grid-column:1/-1}.result-images{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel-head{min-height:0}}
@media(max-width:650px){body{font-size:16px}.controls,.panels,.result-images{grid-template-columns:1fr}.panel:last-child{grid-column:auto}.caption{min-height:0}.control{padding:12px}button{font-size:1rem}.panel-head{padding:12px}}
</style>
</head>
<body><div class="app">
<header><div><h1 data-de="Lichtfeld-Explorer" data-en="Light field explorer"></h1><p class="hint" data-de="Mikrolinsen-Rohbild → Subaperturbilder → Shift and Add" data-en="Microlens raw image → sub-aperture images → shift and add"></p></div><div class="actions"><button id="language">Deutsch</button><button id="theme" data-de="Hell / Dunkel" data-en="Light / Dark"></button><button id="reset">Reset (R)</button></div></header>
<section class="controls">
<div class="control"><h2 data-de="1 · Blickrichtung wählen" data-en="1 · Choose a viewpoint"></h2><label class="slider"><span>j <output id="jValue"></output></span><input id="j" aria-label="j" type="range" min="1" max="7" value="4"></label><label class="slider"><span>k <output id="kValue"></output></span><input id="k" aria-label="k" type="range" min="1" max="7" value="4"></label><p class="hint" data-de="Oder ein Pixel im vergrößerten Mikrobild anklicken. j: nach rechts, k: nach unten." data-en="Or click a pixel in the enlarged microimage. j: rightwards, k: downwards."></p></div>
<div class="control"><h2 data-de="2 · Mikrolinse auswählen" data-en="2 · Select a microlens"></h2><label class="slider"><span>m <output id="mValue"></output></span><input id="m" aria-label="m" type="range" min="1" max="96" value="48"></label><label class="slider"><span>n <output id="nValue"></output></span><input id="n" aria-label="n" type="range" min="1" max="72" value="36"></label><label><input id="marks" type="checkbox" checked> <span data-de="Gleiche Winkel markieren" data-en="Mark matching angles"></span></label></div>
<div class="control"><h2 data-de="3 · Refokussieren" data-en="3 · Refocus"></h2><label class="slider"><span><span data-de="Scherung s" data-en="Shear s"></span><output id="focusValue"></output></span><input id="focus" type="range" min="-2" max="2" step="0.05" value="0"></label><div class="presets"><button data-focus="-1.5" data-de="Fern" data-en="Far"></button><button data-focus="0" data-de="Mitte" data-en="Middle"></button><button data-focus="1.5" data-de="Nah" data-en="Near"></button></div><p class="hint" data-de="Einheit: SAI-Pixel pro Winkelschritt. Voreinstellungen richten jeweils eine Tiefenebene aus." data-en="Unit: SAI pixels per angular step. Each preset aligns one depth plane."></p></div>
<div class="control"><h2 data-de="4 · Virtuelle Blende" data-en="4 · Virtual aperture"></h2><label class="slider"><span><span data-de="Blendenradius r" data-en="Aperture radius r"></span><output id="radiusValue"></output></span><input id="radius" type="range" min="0" max="3" value="3"></label><label class="slider"><span><span data-de="Rauschen σ" data-en="Noise σ"></span><output id="noiseValue"></output></span><input id="noise" type="range" min="0" max="25" value="0"></label><p class="hint" id="apertureNote"></p></div>
</section>
<main class="panels">
<section class="panel"><div class="panel-head"><h2 class="orange" data-de="① Räumlich multiplexiertes Rohbild g" data-en="① Spatially multiplexed raw image g"></h2><p class="hint" data-de="Jede 7 × 7-Kachel ist ein Mikrobild. Klicken wählt Mikrolinse und Winkelpixel." data-en="Each 7 × 7 tile is a microimage. Click to select a microlens and angular pixel."></p></div><div class="panel-body"><div class="image"><canvas id="raw" width="672" height="504" role="img" aria-label="Microlens raw image"></canvas><canvas id="rawOverlay" width="672" height="504" aria-label="Select a raw sensor pixel"></canvas></div><p class="caption" id="rawNote"></p><h2 data-de="Gewähltes Mikrobild · vergrößert" data-en="Selected microimage · enlarged"></h2><div class="lens-grid" id="lens" role="group" aria-label="Angular pixels"></div><p class="hint" data-de="Orange: gewähltes Winkelpixel · +: Zentralansicht. Die Farben sind die tatsächlichen Messwerte dieser Mikrolinse." data-en="Orange: selected angular pixel · +: central view. Colours are the actual samples of this microlens."></p><div class="formula" id="mapping"></div></div></section>
<section class="panel"><div class="panel-head"><h2 class="blue" data-de="② Subaperturbild L⁽ʲ,ᵏ⁾" data-en="② Sub-aperture image L⁽ʲ,ᵏ⁾"></h2><p class="hint" data-de="Genau ein gleich positioniertes Pixel pro Mikrolinse ergibt ein Bild." data-en="Exactly one identically positioned pixel per microlens forms an image."></p></div><div class="panel-body"><div class="image"><canvas id="sai" width="96" height="72" role="img" aria-label="Selected sub-aperture image"></canvas><canvas id="saiOverlay" width="672" height="504" aria-label="Select a spatial sample"></canvas></div><p class="caption" id="saiNote"></p><div class="formula">L⁽ʲ,ᵏ⁾(m,n) = L(m,n,j,k)<br><span data-de="96 × 72 Ortspixel · 7 × 7 Blickrichtungen" data-en="96 × 72 spatial pixels · 7 × 7 viewpoints"></span></div><section class="info observation"><h2 data-de="Ausprobieren" data-en="Try it"></h2><p data-de="Bewege j von links nach rechts: Welche Karte wandert am stärksten? Welcher Teil bleibt stehen? Beobachte auch Verdeckungen an den Kartenrändern." data-en="Move j from left to right: which card moves most? Which part stays still? Also watch occlusions at the card edges."></p></section></div></section>
<section class="panel"><div class="panel-head"><h2 class="green" data-de="③ Refokussiertes Bild" data-en="③ Refocused image"></h2><p class="hint" data-de="Mehrere Ansichten verschieben und normiert addieren. Die Blende bleibt um die Zentralansicht zentriert." data-en="Shift multiple views and average them. The aperture stays centred on the central view."></p></div><div class="panel-body"><div class="result-images"><div><div class="image"><canvas id="refocused" width="96" height="72" role="img" aria-label="Shift-and-add result"></canvas></div><p class="caption metrics" id="resultNote"></p></div><div><h2 data-de="Ausrichtung prüfen: Welche Tiefe kommt zur Deckung?" data-en="Check alignment: which depth lines up?"></h2><div class="image"><canvas id="alignment" width="96" height="72" role="img" aria-label="Alignment of selected and central views"></canvas></div><p class="caption" id="shiftNote"></p></div></div><div class="formula">Iₛ(x,y) = mean<sub>(u,v) ∈ Aᵣ</sub><br>L(x + s·u, y + s·v, u+4, v+4)</div><p class="hint" data-de="s = 0: nur mitteln. Bei passender Scherung fallen die Strukturen einer Tiefe zusammen; andere Tiefen werden unscharf." data-en="s = 0: average only. At the matching shear, structures at one depth coincide; other depths become blurred."></p></div></section>
</main>
<section class="info"><h2 data-de="Beobachtungsfragen" data-en="Questions to explore"></h2><ol><li data-de="Warum liefert ein 672 × 504-Rohbild nur 96 × 72 Pixel pro Subaperturbild?" data-en="Why does a 672 × 504 raw image provide only 96 × 72 pixels per sub-aperture image?"></li><li data-de="Stelle die Blende auf r = 0. Warum hat der Fokusregler jetzt keinen Einfluss?" data-en="Set the aperture to r = 0. Why does the focus slider now have no effect?"></li><li data-de="Aktiviere Rauschen und vergleiche r = 0 mit r = 3. Wie ändern sich Rauschen und Schärfentiefe?" data-en="Enable noise and compare r = 0 with r = 3. How do noise and depth of field change?"></li></ol></section>
<section class="info"><details><summary data-de="Modell & Bezug zu Kapitel 3" data-en="Model & relation to Chapter 3"></summary><ul>
<li data-de="Synthetisches, ideal kalibriertes 4D-Lichtfeld: 96 × 72 Mikrolinsen, je 7 × 7 Winkelpixel. Drei strukturierte Karten mit Disparitäten −1,5 (Fern, blau), 0 (Mitte, grün) und +1,5 (Nah, orange) Pixel pro Winkelschritt. Die zentrale Ansicht liegt bei j = k = 4. Alle Koordinaten in der Bedienoberfläche sind 1-basiert." data-en="Synthetic, ideally calibrated 4D light field: 96 × 72 microlenses, each with 7 × 7 angular pixels. Three textured cards with disparities −1.5 (far, blue), 0 (middle, green) and +1.5 (near, orange) pixels per angular step. The central view is j = k = 4. All user-facing coordinates are 1-based."></li>
<li data-de="Die Ansichten entstehen durch Verschieben und Überdecken der drei Ebenen. Das Rohbild wird ausschließlich durch Umordnen dieser Messwerte erzeugt; auch die Refokussierung greift ausschließlich auf die abgetasteten Ansichten zu. Dargestellt ist ein ideal rechteckig gepacktes Mikrobildraster ohne Vignettierung, Beugung oder Linsenfehler." data-en="Views are generated by shifting and compositing the three planes. The raw image is formed exclusively by rearranging these samples; refocusing also uses only the sampled views. Microimages are ideally rectangular-packed without vignetting, diffraction or lens aberrations."></li>
<li data-de="Shift and Add verwendet bilineare Interpolation und eine quadratische Blende Aᵣ = {−r,…,r}². Am Bildrand zählen nur gültige Abtastungen; es gibt keinen zyklischen Umbruch. Der gemeinsame Streckfaktor aus dem Skript wird weggelassen. s ist die diskrete Scherung, nicht α = b′/b; eine Umrechnung benötigt die Orts- und Winkelskalierung der Kamera." data-en="Shift and add uses bilinear interpolation and a square aperture Aᵣ = {−r,…,r}². Only valid samples contribute at image borders; there is no wraparound. The common scaling factor from the notes is omitted. s is the discrete shear, not α = b′/b; converting between them requires the camera’s spatial and angular scales."></li>
<li data-de="Optionales additives, unabhängiges Messrauschen mit festem Seed 17; σ in Intensitätsstufen (0–255). Es wird vor der Umordnung und Refokussierung hinzugefügt. Die Anzeige begrenzt auf 0–255, intern bleiben Werte ungeclippt. Die theoretische Rauschreduktion σ/√N gilt für unabhängige, ganzzahlig verschobene Samples im Bildinneren; Interpolation verändert sie. Keine Simulation von Photonenstatistik oder Belichtungsautomatik." data-en="Optional additive independent measurement noise with fixed seed 17; σ in intensity levels (0–255). Noise is added before rearrangement and refocusing. Display values are clipped to 0–255; internal values remain unclipped. The theoretical noise reduction σ/√N applies to independent integer-shifted samples in the image interior; interpolation changes it. Photon statistics and auto-exposure are not simulated."></li>
</ul></details></section>
<section class="info"><div class="actions"><button id="copyLink" data-de="Zustandslink kopieren" data-en="Copy state link"></button><button id="save" data-de="Widget mit Zustand speichern" data-en="Save widget with state"></button></div><p class="hint" data-de="Offline nutzbar · keine externen Bibliotheken · R: Reset · Winkelraster mit Tab und Pfeiltasten bedienbar" data-en="Works offline · no external libraries · R: reset · use Tab and arrow keys in the angular grid"></p><input id="linkFallback" hidden readonly aria-label="State link"><p id="status" role="status"></p></section>
</div>
<script id="initialState" type="application/json">null</script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), W=96,H=72,A=7,C=4,P=W*H;
const defaults={j:4,k:4,m:48,n:36,focus:0,radius:3,noise:0,marks:true,lang:'en',dark:true};
let state={...defaults},views=[],rawImage=null,focusKey='',pending=false;
const t=(de,en)=>state.lang==='de'?de:en;
const bounds={j:[1,7,1],k:[1,7,1],m:[1,W,1],n:[1,H,1],focus:[-2,2,.05],radius:[0,3,1],noise:[0,25,1]};
function sanitize(input){const s={...defaults};for(const [key,[lo,hi,step]] of Object.entries(bounds)){const n=Number(input[key]??s[key]);s[key]=Number.isFinite(n)?Number((Math.round(Math.max(lo,Math.min(hi,n))/step)*step).toFixed(2)):s[key];}for(const key of ['marks','dark'])s[key]=input[key]===undefined?s[key]:input[key]===true||input[key]==='true';s.lang=input.lang==='de'?'de':'en';return s;}
try{state=sanitize({...JSON.parse($('initialState').textContent),...Object.fromEntries(new URLSearchParams(location.search))});}catch{}
// Textured planar cards are rasterized once. Views, raw sensor and all
// reconstructions subsequently share exactly the same sampled light field.
function layer(x,y,w,h,color,label){const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');ctx.fillStyle=color;ctx.fillRect(x,y,w,h);for(let yy=y+2;yy<y+h-2;yy+=3)for(let xx=x+2;xx<x+w-2;xx+=3){ctx.fillStyle=((xx+yy)%2)?'#e5ebef':'#253c52';ctx.fillRect(xx,yy,1,1);}ctx.fillStyle='#f8fafc';ctx.fillRect(x+3,y+4,w-6,13);ctx.fillStyle='#142438';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(label,x+w/2,y+14);ctx.strokeStyle='#e6edf2';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,w-1,h-1);return ctx.getImageData(0,0,W,H).data;}
const layers=[{d:-1.5,data:layer(8,9,38,47,'#358dd1','FAR')},{d:0,data:layer(34,21,34,44,'#40b589','MID')},{d:1.5,data:layer(61,7,27,42,'#e7943f','NEAR')}];
function hash(n){n=Math.imul(n^17,0x45d9f3b);n=Math.imul(n^(n>>>16),0x45d9f3b);return ((n^(n>>>16))>>>0)/4294967296;}
function gaussian(n){return Math.sqrt(-2*Math.log(Math.max(1e-9,hash(n*2))))*Math.cos(2*Math.PI*hash(n*2+1));}
function rgbaSample(data,x,y){const out=[0,0,0,0],ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;for(let b=0;b<2;b++)for(let a=0;a<2;a++){const xx=ix+a,yy=iy+b;if(xx<0||xx>=W||yy<0||yy>=H)continue;const q=(yy*W+xx)*4,weight=(a?fx:1-fx)*(b?fy:1-fy),alpha=data[q+3]/255;out[3]+=weight*alpha;for(let c=0;c<3;c++)out[c]+=weight*alpha*data[q+c];}return out;}
const cleanViews=[];
for(let k=1;k<=A;k++)for(let j=1;j<=A;j++){const image=new Float32Array(P*3),u=j-C,v=k-C;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let rgb=[21+8*x/W,29+8*y/H,43];for(const l of layers){const sample=rgbaSample(l.data,x-l.d*u,y-l.d*v);for(let c=0;c<3;c++)rgb[c]=sample[c]+rgb[c]*(1-sample[3]);}const q=(y*W+x)*3;for(let c=0;c<3;c++)image[q+c]=rgb[c];}cleanViews.push(image);}
function rebuildViews(){views=cleanViews.map((view,i)=>Float32Array.from(view,(v,q)=>v+state.noise*gaussian(i*P*3+q)));rawImage=new ImageData(W*A,H*A);for(let k=0;k<A;k++)for(let j=0;j<A;j++){const view=views[k*A+j];for(let n=0;n<H;n++)for(let m=0;m<W;m++){const dst=((n*A+k)*W*A+m*A+j)*4,src=(n*W+m)*3;for(let c=0;c<3;c++)rawImage.data[dst+c]=view[src+c];rawImage.data[dst+3]=255;}}$('raw').getContext('2d').putImageData(rawImage,0,0);focusKey='';}
function sample(view,x,y,c){const ix=Math.floor(x),iy=Math.floor(y),xx=Math.min(W-1,ix+1),yy=Math.min(H-1,iy+1),fx=x-ix,fy=y-iy;return (1-fy)*((1-fx)*view[(iy*W+ix)*3+c]+fx*view[(iy*W+xx)*3+c])+fy*((1-fx)*view[(yy*W+ix)*3+c]+fx*view[(yy*W+xx)*3+c]);}
function image(canvas,data){const out=new ImageData(W,H);for(let q=0;q<P;q++){for(let c=0;c<3;c++)out.data[q*4+c]=data[q*3+c];out.data[q*4+3]=255;}canvas.getContext('2d').putImageData(out,0,0);}
function refocus(){const result=new Float32Array(P*3);for(let y=0;y<H;y++)for(let x=0;x<W;x++){let count=0;const q=(y*W+x)*3;for(let v=-state.radius;v<=state.radius;v++)for(let u=-state.radius;u<=state.radius;u++){const xx=x+state.focus*u,yy=y+state.focus*v;if(xx<0||xx>W-1||yy<0||yy>H-1)continue;const view=views[(v+3)*A+u+3];for(let c=0;c<3;c++)result[q+c]+=sample(view,xx,yy,c);count++;}for(let c=0;c<3;c++)result[q+c]/=count;}image($('refocused'),result);}
function align(){const selected=views[(state.k-1)*A+state.j-1],central=views[24],out=new Float32Array(P*3),dx=state.focus*(state.j-C),dy=state.focus*(state.k-C);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const q=(y*W+x)*3,xx=x+dx,yy=y+dy,valid=xx>=0&&xx<=W-1&&yy>=0&&yy<=H-1;for(let c=0;c<3;c++)out[q+c]=valid?(central[q+c]+sample(selected,xx,yy,c))/2:central[q+c];}image($('alignment'),out);}
const buttons=[];
$('lens').replaceChildren();
for(let k=1;k<=A;k++)for(let j=1;j<=A;j++){const b=document.createElement('button');b.type='button';b.dataset.j=j;b.dataset.k=k;if(j===C&&k===C)b.classList.add('center');b.addEventListener('click',()=>{state.j=j;state.k=k;update();});$('lens').append(b);buttons.push(b);}
function overlays(){const ctx=$('rawOverlay').getContext('2d');ctx.clearRect(0,0,W*A,H*A);if(state.marks){ctx.fillStyle='#ffb74d';ctx.globalAlpha=.7;for(let n=0;n<H;n++)for(let m=0;m<W;m++)ctx.fillRect(m*A+state.j-1,n*A+state.k-1,1,1);ctx.globalAlpha=1;}ctx.strokeStyle='#ffb74d';ctx.lineWidth=1;ctx.strokeRect((state.m-1)*A+.5,(state.n-1)*A+.5,A-1,A-1);const px=(state.m-1)*A+state.j-.5,py=(state.n-1)*A+state.k-.5;ctx.beginPath();ctx.arc(px,py,9,0,2*Math.PI);ctx.stroke();const sai=$('saiOverlay').getContext('2d');sai.clearRect(0,0,W*A,H*A);sai.strokeStyle='#ffb74d';sai.lineWidth=2;sai.strokeRect((state.m-1)*A,(state.n-1)*A,A,A);}
function update(){state=sanitize(state);document.documentElement.lang=state.lang;document.documentElement.classList.toggle('dark',state.dark);document.title=t('Lichtfeld-Explorer','Light field explorer');document.querySelectorAll('[data-de]').forEach(node=>node.textContent=node.dataset[state.lang]);$('language').textContent=t('English','Deutsch');for(const key of Object.keys(bounds)){$(key).value=state[key];$(key+'Value').textContent=key==='focus'?state[key].toFixed(2):state[key];}$('marks').checked=state.marks;
const selected=views[(state.k-1)*A+state.j-1];image($('sai'),selected);overlays();const q=((state.n-1)*W+state.m-1)*3;
buttons.forEach((b,i)=>{const j=i%A+1,k=Math.floor(i/A)+1,v=views[i];b.style.background=`rgb(${[0,1,2].map(c=>Math.round(Math.max(0,Math.min(255,v[q+c])))).join(',')})`;b.setAttribute('aria-pressed',j===state.j&&k===state.k);b.setAttribute('aria-label',`${t('Winkelpixel','Angular pixel')} j=${j}, k=${k}`);b.title=`j=${j}, k=${k}`;});
const count=(2*state.radius+1)**2,rawX=(state.m-1)*A+state.j,rawY=(state.n-1)*A+state.k;
$('rawNote').textContent=t(`672 × 504 Sensorpixel. Markiert: Pixel (${state.j}, ${state.k}) unter jeder Mikrolinse. Kreis: Mikrolinse (${state.m}, ${state.n}).`,`672 × 504 sensor pixels. Marked: pixel (${state.j}, ${state.k}) under every microlens. Circle: microlens (${state.m}, ${state.n}).`);
$('mapping').textContent=`L(${state.m},${state.n},${state.j},${state.k}) = g(${rawX},${rawY})`;
$('saiNote').textContent=t(`Blickrichtung (j,k) = (${state.j},${state.k}), zentriert (u,v) = (${state.j-C},${state.k-C}). Orange: Ortspixel (${state.m},${state.n}) aus der gewählten Mikrolinse.`,`Viewpoint (j,k) = (${state.j},${state.k}), centred (u,v) = (${state.j-C},${state.k-C}). Orange: spatial pixel (${state.m},${state.n}) from the selected microlens.`);
$('apertureNote').textContent=t(`${count} Ansicht${count===1?'':'en'} · quadratische, zentrale Blende. Rauschen: fester Seed 17.`,`${count} view${count===1?'':'s'} · square, central aperture. Noise: fixed seed 17.`);
$('resultNote').textContent=t(`${count} Ansicht${count===1?'':'en'} · s = ${state.focus.toFixed(2)}${count===1?' · nur Zentralansicht':''}`,`${count} view${count===1?'':'s'} · s = ${state.focus.toFixed(2)}${count===1?' · central view only':''}`);
const dx=-state.focus*(state.j-C),dy=-state.focus*(state.k-C),inside=Math.abs(state.j-C)<=state.radius&&Math.abs(state.k-C)<=state.radius;
$('shiftNote').textContent=t(`Sichtbare Verschiebung der gewählten Ansicht: Δx = ${dx.toFixed(2)}, Δy = ${dy.toFixed(2)} Pixel. 50/50-Überlagerung mit der Zentralansicht. ${inside?'Diese Ansicht liegt in der Blende.':'Diese Ansicht liegt außerhalb der Blende und geht nicht in das Ergebnis ein.'}`,`Visible shift of the selected view: Δx = ${dx.toFixed(2)}, Δy = ${dy.toFixed(2)} pixels. 50/50 overlay with the central view. ${inside?'This view is inside the aperture.':'This view is outside the aperture and does not contribute to the result.'}`);
document.querySelectorAll('[data-focus]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.focus)===state.focus));const key=`${state.focus}/${state.radius}/${state.noise}`;if(key!==focusKey){refocus();focusKey=key;}align();try{const url=new URL(location.href);url.search=new URLSearchParams(Object.entries(state));history.replaceState(null,'',url);}catch{}
}
function schedule(){if(!pending){pending=true;requestAnimationFrame(()=>{pending=false;update();});}}
for(const key of Object.keys(bounds))$(key).addEventListener('input',()=>{state[key]=Number($(key).value);if(key==='noise')rebuildViews();schedule();});
$('marks').addEventListener('change',()=>{state.marks=$('marks').checked;update();});
document.querySelectorAll('[data-focus]').forEach(b=>b.addEventListener('click',()=>{state.focus=Number(b.dataset.focus);update();}));
function pick(canvas,event,raw){const rect=canvas.getBoundingClientRect(),x=Math.max(0,Math.min(W*A-1,Math.floor((event.clientX-rect.left)/rect.width*W*A))),y=Math.max(0,Math.min(H*A-1,Math.floor((event.clientY-rect.top)/rect.height*H*A)));state.m=Math.floor(x/A)+1;state.n=Math.floor(y/A)+1;if(raw){state.j=x%A+1;state.k=y%A+1;}update();}
$('rawOverlay').addEventListener('pointerdown',e=>pick($('rawOverlay'),e,true));$('saiOverlay').addEventListener('pointerdown',e=>pick($('saiOverlay'),e,false));
$('lens').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();state.j=Math.max(1,Math.min(7,state.j+(e.key==='ArrowRight'?1:e.key==='ArrowLeft'?-1:0)));state.k=Math.max(1,Math.min(7,state.k+(e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0)));update();buttons[(state.k-1)*A+state.j-1].focus();});
function reset(){state={...defaults,lang:state.lang,dark:state.dark};rebuildViews();update();}
$('reset').addEventListener('click',reset);$('language').addEventListener('click',()=>{state.lang=t('en','de');update();});$('theme').addEventListener('click',()=>{state.dark=!state.dark;update();});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey&&!e.altKey&&e.key.toLowerCase()==='r'&&!e.target.matches('input,textarea,select,button')){e.preventDefault();reset();}});
$('copyLink').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);$('status').textContent=t('Zustandslink kopiert.','State link copied.');}catch{$('linkFallback').hidden=false;$('linkFallback').value=location.href;$('linkFallback').select();$('status').textContent=t('Link zum Kopieren auswählen.','Select the link to copy it.');}});
$('save').addEventListener('click',()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#initialState').textContent=JSON.stringify(state);clone.querySelector('#linkFallback').hidden=true;clone.querySelector('#status').textContent='';const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='light-field-explorer.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
rebuildViews();update();
})();
</script>
