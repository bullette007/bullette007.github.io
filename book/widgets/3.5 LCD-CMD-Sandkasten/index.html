<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCD / CMD Sandbox</title>
<style>
:root{color-scheme:light;--bg:#eef3f8;--card:#fff;--line:#cbd6e2;--text:#172334;--muted:#526579;--blue:#1769aa;--purple:#7048c8;--orange:#a95000}
:root.dark{color-scheme:dark;--bg:#08111f;--card:#101c2d;--line:#2a3b52;--text:#edf4ff;--muted:#a8b9ce;--blue:#75baff;--purple:#bb9aff;--orange:#ffad57}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:clamp(10px,2vw,28px);background:var(--bg);color:var(--text);font:17px/1.45 system-ui,"Segoe UI",sans-serif}.app{max-width:1550px;margin:auto}header,.actions,.presets{display:flex;flex-wrap:wrap;gap:10px;align-items:center}header{justify-content:space-between;margin-bottom:18px}h1{font-size:clamp(1.6rem,3vw,2.3rem);letter-spacing:-.04em;margin:0}h2{font-size:1.12rem;margin:0}h3{font-size:1rem;margin:0}p{margin:8px 0}.hint,header p{color:var(--muted)}.hint{font-size:.92rem}button,input,select{font:inherit}button,select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;cursor:pointer}button:hover{border-color:var(--purple)}:focus-visible{outline:3px solid var(--purple);outline-offset:3px}input[type=range]{width:100%;min-height:30px;accent-color:var(--purple)}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;accent-color:var(--purple);margin-right:8px}select{max-width:100%}.presets{margin-bottom:18px}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px}aside,.panel,.info,.metric{background:var(--card);border:1px solid var(--line);border-radius:14px}aside{align-self:start;padding:17px}main{min-width:0}.control{display:block;margin:15px 0}.control>span{display:flex;justify-content:space-between;gap:8px;font-weight:650}output{color:var(--purple);white-space:nowrap}.check{display:block;margin:14px 0}.panel{overflow:hidden;min-width:0}.panel-head{padding:12px 15px;border-bottom:1px solid var(--line)}.panel-head p{font-size:.9rem;color:var(--muted)}.pair,.triple,.metrics{display:grid;gap:14px;margin-bottom:16px}.pair{grid-template-columns:repeat(2,minmax(0,1fr))}.triple,.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.info{padding:15px 18px;margin-bottom:16px}.metric{padding:13px 15px}.metric strong{display:block;font:700 1.65rem ui-monospace,Consolas,monospace;color:var(--purple);overflow-wrap:anywhere}.formula{font:1rem/1.8 ui-monospace,Consolas,monospace;overflow-wrap:anywhere;color:var(--purple)}svg{display:block;width:100%;height:auto}svg text{fill:var(--text);font:14px system-ui,sans-serif}svg .value{font:11px ui-monospace,Consolas,monospace;pointer-events:none}svg .axis{fill:var(--muted);font-size:12px}.scale{margin:0 15px 12px;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}.bars{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin-top:12px}.bar{min-width:0;padding:8px 2px;font-size:.8rem;border-radius:7px}.bar[aria-pressed=true]{border:2px solid var(--orange);padding:7px 1px}.bar-track{height:110px;display:flex;align-items:flex-end;justify-content:center;margin:5px 0;background:var(--bg);border-radius:4px}.bar-fill{width:72%;background:var(--blue);min-height:0}.bar[aria-pressed=true] .bar-fill{background:var(--orange)}.bar-number{display:block;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}#linkFallback{width:100%}summary{cursor:pointer}li{margin:7px 0}fieldset{border:0;padding:0;margin:0}legend{font-weight:700;margin-bottom:8px}hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.metrics{position:sticky;top:8px;z-index:5;padding:6px;background:var(--bg);border-radius:16px;box-shadow:0 4px 14px #0002}.metric:last-child{border-color:var(--purple)}
@media(max-width:1100px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.wide{grid-column:1/-1}}
@media(max-width:650px){body{font-size:16px}.pair,.triple{grid-template-columns:1fr}.metrics{gap:7px}.metric{padding:10px 8px;font-size:.85rem}.metric strong{font-size:1.1rem}aside{display:block}.bars{gap:3px}.bar{font-size:.65rem}.info{padding:13px 10px}}
</style>
</head>
<body><div class="app">
<header><div><h1 data-de="LCD / CMD · Sandkasten" data-en="LCD / CMD · Sandbox"></h1><p data-de="Winkelverteilungen → lokale Summen → Abstand über alle Skalen" data-en="Angular distributions → local sums → distance across all scales"></p></div><div class="actions"><button id="language">Deutsch</button><button id="theme" data-de="Hell / Dunkel" data-en="Light / Dark"></button><button id="reset">Reset (R)</button></div></header>
<nav class="presets" aria-label="Experiments">
<button data-preset="equal" data-de="1 · Identisch" data-en="1 · Identical"></button><button data-preset="shift" data-de="2 · Peak verschieben" data-en="2 · Shift peak"></button><button data-preset="spread" data-de="3 · Peak verbreitern" data-en="3 · Broaden peak"></button><button data-preset="intensity" data-de="4 · Intensität ändern" data-en="4 · Change intensity"></button><button data-preset="noise" data-de="5 · Rauschen" data-en="5 · Noise"></button>
</nav>
<div class="layout"><aside>
<fieldset class="wide"><legend data-de="Darstellungen einblenden" data-en="Show views"></legend>
<label class="check"><input type="checkbox" id="showDistributions" aria-controls="distributionViews"><span data-de="Winkelverteilungen f / h" data-en="Angular distributions f / h"></span></label>
<label class="check"><input type="checkbox" id="showScales" aria-controls="scaleView"><span data-de="CMD-Skalenbeiträge" data-en="CMD scale contributions"></span></label>
<label class="check"><input type="checkbox" id="showLCD" aria-controls="lcdViews"><span data-de="LCD-Gitter F / H / Differenz" data-en="LCD grids F / H / difference"></span></label>
<label class="check"><input type="checkbox" id="showDetails" aria-controls="localSums learningNotes modelNotes"><span data-de="Erklärungen & Beobachtungsfragen" data-en="Explanations & observation questions"></span></label><hr>
</fieldset>
<fieldset><legend data-de="Verteilung bearbeiten" data-en="Edit distribution"></legend><label><span data-de="Ziel: " data-en="Target: "></span><select id="target"><option value="f" data-de="f · Referenz" data-en="f · Reference"></option><option value="h" data-de="h · Vergleich" data-en="h · Comparison"></option></select></label><div id="distributionControls"></div><p class="hint" id="editStatus"></p><button id="regenerate" data-de="Gaußprofil neu erzeugen" data-en="Regenerate Gaussian"></button></fieldset>
<div><hr><h2 data-de="LCD untersuchen" data-en="Explore the LCD"></h2><div id="lcdControls"></div></div>
<div class="wide"><label class="check"><input type="checkbox" id="normalize"><span data-de="Jede Verteilung auf Summe 1 normieren" data-en="Normalize each distribution to sum 1"></span></label><label class="check"><input type="checkbox" id="numbers"><span data-de="Zellwerte anzeigen" data-en="Show cell values"></span></label><label class="check"><input type="checkbox" id="paint"><span data-de="In f / h malen statt Position wählen" data-en="Paint in f / h instead of selecting a position"></span></label><label class="control"><span><span data-de="Pinselschritt (+)" data-en="Brush increment (+)"></span><output id="brushValue"></output></span><input id="brush" type="range" min="0" max="1" step="0.05"></label><p class="hint" data-de="Klick: Position wählen. Im Malmodus: Jeder Klick addiert den Pinselschritt (bis 2); Schritt 0 löscht. Pfeiltasten bewegen die Auswahl; Leertaste malt. Modellregler erzeugen das gewählte Profil neu." data-en="Click: select a position. In paint mode: each click adds the brush increment (up to 2); increment 0 erases. Arrow keys move the selection; Space paints. Model sliders regenerate the selected profile."></p></div>
</aside><main>
<div class="metrics" aria-live="polite"><div class="metric">L₂ = √Σ(f−h)²<strong id="l2"></strong></div><div class="metric">L₂² = C₀<strong id="l2Squared"></strong></div><div class="metric">CMD = Σ Cᵦ<strong id="cmd"></strong></div></div>
<div class="pair" id="distributionViews">
<section class="panel"><div class="panel-head"><h2 data-de="f · Referenzverteilung" data-en="f · Reference distribution"></h2><p id="massF"></p></div><svg id="gridF" viewBox="0 0 400 400" tabindex="0" role="img"></svg><p class="scale" id="scaleF"></p></section>
<section class="panel"><div class="panel-head"><h2 data-de="h · Vergleichsverteilung" data-en="h · Comparison distribution"></h2><p id="massH"></p></div><svg id="gridH" viewBox="0 0 400 400" tabindex="0" role="img"></svg><p class="scale" id="scaleH"></p></section>
</div>
<div class="triple" id="lcdViews">
<section class="panel"><div class="panel-head"><h2>F(x, b)</h2><p data-de="LCD der Referenz" data-en="LCD of the reference"></p></div><svg id="lcdF" viewBox="0 0 400 400" tabindex="0" role="img"></svg><p class="scale" id="scaleLcdF"></p></section>
<section class="panel"><div class="panel-head"><h2>H(x, b)</h2><p data-de="LCD des Vergleichs" data-en="LCD of the comparison"></p></div><svg id="lcdH" viewBox="0 0 400 400" tabindex="0" role="img"></svg><p class="scale" id="scaleLcdH"></p></section>
<section class="panel"><div class="panel-head"><h2>F(x, b) − H(x, b)</h2><p data-de="Blau: negativ · Orange: positiv" data-en="Blue: negative · Orange: positive"></p></div><svg id="difference" viewBox="0 0 400 400" tabindex="0" role="img"></svg><p class="scale" id="scaleDifference"></p></section>
</div>
<section class="info" id="localSums"><h2 data-de="Ein Fenster, zwei lokale Summen" data-en="One window, two local sums"></h2><p data-de="Der orange Rahmen sammelt alle Werte mit |tₓ−x| ≤ b und |tᵧ−y| ≤ b. Am Rand wird das Fenster abgeschnitten, nicht gemittelt." data-en="The orange frame collects all values with |tₓ−x| ≤ b and |tᵧ−y| ≤ b. At the boundary the window is clipped, not averaged."></p><div class="formula" id="localReadout" aria-live="polite"></div><p id="normalizationNote" class="hint"></p></section>
<section class="info" id="scaleView"><h2 data-de="Welche Skalen tragen zum CMD bei?" data-en="Which scales contribute to the CMD?"></h2><div class="formula">Cᵦ = Σₓ (F(x,b) − H(x,b))² &nbsp; · &nbsp; CMD = Σᵦ₌₀⁸ Cᵦ</div><p class="hint" data-de="Balken anklicken, um den LCD-Radius zu wählen. Gemeinsame lineare Balkenskala; der CMD summiert immer alle Radien 0…8." data-en="Click a bar to choose the LCD radius. Shared linear bar scale; CMD always sums all radii 0…8."></p><div class="bars" id="contributions"></div><p id="contributionReadout"></p><p id="interpretation"></p></section>
<section class="info" id="learningNotes"><h2 data-de="Ausprobieren & beobachten" data-en="Try & observe"></h2><ol>
<li data-de="Verschiebe einen punktförmigen Peak um 1, 2 und 3 Zellen. Warum bleibt L₂ gleich, während sich der CMD ändert?" data-en="Shift a point-like peak by 1, 2 and 3 cells. Why does L₂ stay the same while CMD changes?"></li>
<li data-de="Verbreitere nur h bei gleicher Gesamtintensität. Welche Fenster sehen noch einen Unterschied?" data-en="Broaden only h at equal total intensity. Which windows still see a difference?"></li>
<li data-de="Wähle das Intensitäts-Preset, dann schalte die Normierung ein. Welche Information geht verloren?" data-en="Choose the intensity preset, then enable normalization. Which information is lost?"></li>
<li data-de="Wähle Rauschen und erhöhe b. Warum können sich positive und negative Differenzen innerhalb eines Fensters aufheben? Ist das für jedes Rauschen garantiert?" data-en="Choose noise and increase b. Why can positive and negative differences cancel inside a window? Is that guaranteed for every noise pattern?"></li>
</ol></section>
<section class="info" id="modelNotes"><details><summary data-de="Modell & Bezug zu Kapitel 3" data-en="Model & relation to Chapter 3"></summary><ul>
<li data-de="Diskrete Definition aus Kapitel 3: Ω = {0,…,8}², quadratische Fenster mit Radius b = 0,…,8. Seitenlänge vor Randbeschnitt: 2b+1. Jeder Ort und jeder Radius zählt mit Gewicht 1. Keine Wurzel des CMD, keine Mittelung über Fensterfläche oder Skalen." data-en="Discrete definition from Chapter 3: Ω = {0,…,8}², square windows of radius b = 0,…,8. Side length before boundary clipping: 2b+1. Each position and radius has weight 1. No square root of CMD, no averaging over window area or scales."></li>
<li data-de="Gaußprofile werden auf dem endlichen Gitter zuerst auf Summe 1 normiert; σ = 0 ergibt einen Einzelpeak. Rauschen: reproduzierbare, unabhängige gleichverteilte Werte in [−η/81,+η/81] addieren, negative Werte auf 0 setzen, erneut auf Summe 1 bringen, dann mit der Gesamtintensität skalieren. Kein physikalisches Sensormodell. Malen addiert den Pinselschritt zum rohen Zellwert (Maximum 2); Schritt 0 löscht." data-en="Gaussian profiles are first normalized to sum 1 on the finite grid; σ = 0 produces a single peak. Noise: add reproducible independent uniform values in [−η/81,+η/81], clip negative values to 0, renormalize to sum 1, then scale by total intensity. No physical sensor model. Painting adds the brush increment to the raw cell value (maximum 2); increment 0 erases."></li>
<li data-de="Optionale Normierung erfolgt vor allen Anzeigen und Abstandsrechnungen. Eine Nullverteilung bleibt 0; sie kann nicht auf Summe 1 normiert werden. f und h teilen eine Wurzel-Farbskala: Farbhelligkeit ∝ √(Wert/Skalenmaximum), damit breite Peaks sichtbar bleiben. Zahlen und Berechnungen verwenden die unveränderten Intensitäten. F und H teilen eine lineare Farbskala mit Maximum = größere Gesamtsumme, unabhängig von b. Die Differenzskala ist linear und symmetrisch." data-en="Optional normalization precedes all displays and distance calculations. A zero distribution stays 0; it cannot be normalized to sum 1. f and h share a square-root color scale: color brightness ∝ √(value/scale maximum), keeping broad peaks visible. Numbers and calculations use unchanged intensities. F and H share a linear color scale with maximum = larger total sum, independent of b. The difference scale is linear and symmetric."></li>
<li data-de="LCDs werden mit Summed-Area Tables berechnet: vier Tabellenzugriffe pro Rechtecksumme. Bei b = 0 gilt F = f und H = h, also C₀ = L₂². Bei b = 8 umfasst jedes Fenster das ganze Gitter: C₈ = 81 (Σf−Σh)². CMD und L₂ haben unterschiedliche Skalen; ihre bloße Zahlengröße bewertet keine Güte. Randbeschnitt beeinflusst die Ortsabhängigkeit des CMD." data-en="LCDs use summed-area tables: four table lookups per rectangle sum. At b = 0, F = f and H = h, hence C₀ = L₂². At b = 8, every window covers the entire grid: C₈ = 81 (Σf−Σh)². CMD and L₂ have different scales; their raw magnitudes do not rank their quality. Boundary clipping affects the position dependence of CMD."></li>
</ul></details></section>
</main></div>
<section class="info"><div class="actions"><button id="copyLink" data-de="Zustandslink kopieren" data-en="Copy state link"></button><button id="save" data-de="Widget mit Zustand speichern" data-en="Save widget with state"></button></div><p class="hint" data-de="Offline nutzbar · keine externen Bibliotheken · R: Reset" data-en="Works offline · no external libraries · R: reset"></p><input id="linkFallback" hidden readonly aria-label="State link"><p id="status" role="status"></p></section>
</div>
<script id="initialState" type="application/json">null</script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), N=9, SIZE=N*N;
const defaults={fx:0,fy:0,fsigma:0,fmass:1,fnoise:0,hx:2,hy:0,hsigma:0,hmass:1,hnoise:0,b:1,x:4,y:4,brush:.5,target:'h',normalize:false,numbers:true,paint:false,dark:true,lang:'en',customF:null,customH:null};
const views={showDistributions:['distributionViews'],showScales:['scaleView'],showLCD:['lcdViews'],showDetails:['localSums','learningNotes','modelNotes']};
Object.assign(defaults,{showDistributions:true,showScales:true,showLCD:false,showDetails:false});
$('lcdViews').before($('scaleView'));
function viewState(){return Object.fromEntries(Object.keys(views).map(key=>[key,state[key]]));}
const profileControls=[['x',-4,4,1,'Peak x','Peak x'],['y',-4,4,1,'Peak y','Peak y'],['sigma',0,2,.1,'Breite σ','Width σ'],['mass',0,2,.05,'Gesamtintensität','Total intensity'],['noise',0,1,.05,'Rauschen η','Noise η']];
const lcdControls=[['b',0,8,1,'Fensterradius b','Window radius b'],['x',0,8,1,'Auswahl x','Selection x'],['y',0,8,1,'Auswahl y','Selection y']];
const ranges={brush:[0,1,.05]};
for(const p of ['f','h'])for(const [key,lo,hi,step] of profileControls)ranges[p+key]=[lo,hi,step];
for(const [key,lo,hi,step] of lcdControls)ranges[key]=[lo,hi,step];
function sanitize(input){const s={...defaults};for(const [key,[lo,hi,step]] of Object.entries(ranges)){const n=Number(input[key]??s[key]);if(Number.isFinite(n))s[key]=Number((lo+Math.round((Math.max(lo,Math.min(hi,n))-lo)/step)*step).toFixed(4));}for(const key of ['normalize','numbers','paint','dark',...Object.keys(views)])s[key]=input[key]===undefined?s[key]:input[key]===true||input[key]==='true';s.lang=input.lang==='de'?'de':'en';s.target=input.target==='f'?'f':'h';for(const key of ['customF','customH']){let a=input[key];try{if(typeof a==='string')a=JSON.parse(a);}catch{a=null;}if(Array.isArray(a)&&a.length===SIZE&&a.every(v=>typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=2))s[key]=a.slice();}return s;}
let state={...defaults};try{state=sanitize({...JSON.parse($('initialState').textContent),...Object.fromEntries(new URLSearchParams(location.search))});}catch{}
const t=(de,en)=>state.lang==='de'?de:en, sum=a=>a.reduce((s,v)=>s+v,0), fmt=n=>Math.abs(n)<1e-12?'0':Number(n.toPrecision(4)).toString();
function addControls(root,controls,prefix=''){root.replaceChildren();for(const [key,lo,hi,step,de,en] of controls){const label=document.createElement('label');label.className='control';label.innerHTML=`<span><span data-de="${de}" data-en="${en}"></span><output id="${prefix+key}Value"></output></span><input id="${prefix+key}" type="range" min="${lo}" max="${hi}" step="${step}">`;root.append(label);}}
addControls($('distributionControls'),profileControls,'edit');addControls($('lcdControls'),lcdControls);
function profile(p){const custom=state[p==='f'?'customF':'customH'];if(custom)return custom.slice();const x=state[p+'x']+4,y=state[p+'y']+4,sigma=state[p+'sigma'];let a=Array.from({length:SIZE},(_,i)=>sigma===0?Number(i===y*N+x):Math.exp(-((i%N-x)**2+(Math.floor(i/N)-y)**2)/(2*sigma*sigma)));const total=sum(a);a=a.map(v=>v/total);let seed=p==='f'?17:83;const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};a=a.map(v=>Math.max(0,v+state[p+'noise']/SIZE*(2*random()-1)));const noisyTotal=sum(a);return a.map(v=>v/noisyTotal*state[p+'mass']);}
function sat(a){const s=new Float64Array((N+1)**2);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=(y+1)*(N+1)+x+1;s[i]=a[y*N+x]+s[i-1]+s[i-N-1]-s[i-N-2];}return s;}
function lcd(s,b){return Array.from({length:SIZE},(_,i)=>{const x=i%N,y=Math.floor(i/N),x0=Math.max(0,x-b),y0=Math.max(0,y-b),x1=Math.min(N,x+b+1),y1=Math.min(N,y+b+1);return s[y1*(N+1)+x1]-s[y0*(N+1)+x1]-s[y1*(N+1)+x0]+s[y0*(N+1)+x0];});}
let result;
function calculate(){const rawF=profile('f'),rawH=profile('h'),mf=sum(rawF),mh=sum(rawH),f=rawF.map(v=>state.normalize&&mf>0?v/mf:v),h=rawH.map(v=>state.normalize&&mh>0?v/mh:v),sf=sat(f),sh=sat(h),Fs=[],Hs=[],contributions=[];for(let b=0;b<N;b++){Fs[b]=lcd(sf,b);Hs[b]=lcd(sh,b);contributions[b]=sum(Fs[b].map((v,i)=>(v-Hs[b][i])**2));}const l2Squared=sum(f.map((v,i)=>(v-h[i])**2));return {rawF,rawH,mf,mh,f,h,Fs,Hs,contributions,l2Squared,cmd:sum(contributions)};}
const NS='http://www.w3.org/2000/svg';
function el(root,tag,attrs={},value){const node=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);if(value!==undefined)node.textContent=value;root.append(node);return node;}
function colorLevel(v,max,sqrt=false){const q=max>0?Math.min(1,Math.abs(v)/max):0;return sqrt?Math.sqrt(q):q;}
function color(v,max,signed,sqrt=false){const q=colorLevel(v,max,sqrt),base=[22,35,54],end=signed&&v<0?[81,165,255]:signed?[255,161,75]:[125,207,235];return `rgb(${base.map((c,i)=>Math.round(c+(end[i]-c)*q)).join(',')})`;}
function drawGrid(id,a,max,{signed=false,window=false,sqrt=false}={}){const svg=$(id);svg.replaceChildren();const left=42,top=28,cell=36;for(let i=0;i<SIZE;i++){const x=i%N,y=Math.floor(i/N),g=el(svg,'g',{'data-index':i,'data-value':a[i]});el(g,'rect',{x:left+x*cell,y:top+(8-y)*cell,width:cell,height:cell,fill:color(a[i],max,signed,sqrt),stroke:'var(--line)','stroke-width':.5});el(g,'title',{},`(${x}, ${y}): ${fmt(a[i])}`);if(state.numbers)el(g,'text',{x:left+(x+.5)*cell,y:top+(8-y+.5)*cell+4,class:'value','text-anchor':'middle',style:`fill:${colorLevel(a[i],max,sqrt)>.55?'#08111f':'#edf4ff'}`},fmt(a[i]));}
 for(let i=0;i<N;i++){el(svg,'text',{x:left+(i+.5)*cell,y:top+N*cell+18,class:'axis','text-anchor':'middle'},i);el(svg,'text',{x:left-12,y:top+(8-i+.5)*cell+4,class:'axis','text-anchor':'middle'},i);}el(svg,'text',{x:382,y:374,class:'axis'},'x');el(svg,'text',{x:15,y:17,class:'axis'},'y');
 if(window){const x0=Math.max(0,state.x-state.b),x1=Math.min(8,state.x+state.b),y0=Math.max(0,state.y-state.b),y1=Math.min(8,state.y+state.b);el(svg,'rect',{x:left+x0*cell+1.5,y:top+(8-y1)*cell+1.5,width:(x1-x0+1)*cell-3,height:(y1-y0+1)*cell-3,fill:'none',stroke:'#ffad57','stroke-width':3,'pointer-events':'none'});}
 el(svg,'rect',{x:left+state.x*cell+4,y:top+(8-state.y)*cell+4,width:cell-8,height:cell-8,fill:'none',stroke:'#fff','stroke-width':2,'pointer-events':'none'});
 svg.setAttribute('aria-label',`${id}: ${t('Auswahl','Selection')} (${state.x}, ${state.y}) = ${fmt(a[state.y*N+state.x])}. ${t('Pfeiltasten: Auswahl verschieben.','Arrow keys: move selection.')}`);
}
function writeURL(){try{const u=new URL(location.href);u.search=new URLSearchParams(Object.entries(state).filter(([,v])=>v!==null).map(([k,v])=>[k,Array.isArray(v)?JSON.stringify(v):String(v)]));history.replaceState(null,'',u);}catch{}}
function update(){state=sanitize(state);document.documentElement.lang=state.lang;document.documentElement.classList.toggle('dark',state.dark);document.querySelectorAll('[data-de]').forEach(n=>n.textContent=n.dataset[state.lang]);$('language').textContent=state.lang==='de'?'English':'Deutsch';document.title=t('LCD / CMD · Sandkasten','LCD / CMD · Sandbox');$('target').value=state.target;
 for(const [key,ids] of Object.entries(views)){$(key).checked=state[key];for(const id of ids)$(id).hidden=!state[key];}
 for(const [key] of profileControls){$('edit'+key).value=state[state.target+key];$('edit'+key+'Value').textContent=fmt(state[state.target+key]);}for(const key of ['b','x','y','brush']){$(key).value=state[key];$(key+'Value').textContent=fmt(state[key]);}for(const key of ['normalize','numbers','paint'])$(key).checked=state[key];$('brush').disabled=!state.paint;
 $('editStatus').textContent=state[state.target==='f'?'customF':'customH']?t('Manuell bearbeitet. Modellregler ersetzen die gemalten Werte.','Manually edited. Model sliders replace painted values.'):t('Synthetisches Profil; Gesamtintensität bleibt beim Verbreitern und Rauschen konstant.','Synthetic profile; broadening and noise preserve total intensity.');
 result=calculate();const r=result,b=state.b,F=r.Fs[b],H=r.Hs[b],diff=F.map((v,i)=>v-H[i]),rawScale=Math.max(...r.f,...r.h),lcdScale=Math.max(sum(r.f),sum(r.h)),diffScale=Math.max(...diff.map(Math.abs)),idx=state.y*N+state.x;
 drawGrid('gridF',r.f,rawScale,{window:true,sqrt:true});drawGrid('gridH',r.h,rawScale,{window:true,sqrt:true});drawGrid('lcdF',F,lcdScale);drawGrid('lcdH',H,lcdScale);drawGrid('difference',diff,diffScale,{signed:true});
 for(const p of ['F','H'])$('mass'+p).textContent=t('Rohsumme','Raw sum')+` = ${fmt(r[p==='F'?'mf':'mh'])} · `+t('angezeigt','displayed')+` = ${fmt(sum(r[p.toLowerCase()]))}`;
 const scale=t('Gemeinsame Farbskala','Shared color scale');for(const id of ['scaleF','scaleH'])$(id).textContent=t('Gemeinsame Wurzel-Farbskala','Shared square-root color scale')+`: 0 … ${fmt(rawScale)}`;for(const id of ['scaleLcdF','scaleLcdH'])$(id).textContent=`${scale}: 0 … ${fmt(lcdScale)}`;$('scaleDifference').textContent=t('Symmetrische Skala','Symmetric scale')+`: −${fmt(diffScale)} … 0 … +${fmt(diffScale)}`;
 $('localReadout').textContent=`x = (${state.x}, ${state.y}), b = ${b} → F = ${fmt(F[idx])}, H = ${fmt(H[idx])} → (F−H)² = ${fmt(diff[idx]**2)}`;
 $('normalizationNote').textContent=state.normalize?(r.mf===0||r.mh===0?t('Normierung aktiv. Achtung: Eine Nullverteilung bleibt 0, da ihre Summe 0 ist.','Normalization enabled. A zero distribution stays 0 because its sum is 0.'):t('Normierung aktiv: Verglichen wird nur die Form, nicht die Gesamtintensität.','Normalization enabled: comparing shape, not total intensity.')):t('Ohne Normierung: Form und Gesamtintensität gehen in beide Abstandsmaße ein.','Without normalization: both shape and total intensity affect both distances.');
 $('l2').textContent=fmt(Math.sqrt(r.l2Squared));$('l2Squared').textContent=fmt(r.l2Squared);$('cmd').textContent=fmt(r.cmd);
 const bars=$('contributions');bars.replaceChildren();const max=Math.max(...r.contributions);r.contributions.forEach((v,i)=>{const button=document.createElement('button');button.className='bar';button.dataset.b=i;button.setAttribute('aria-pressed',String(i===b));button.setAttribute('aria-label',`b = ${i}, C = ${fmt(v)}`);const label=document.createElement('span');label.textContent='b='+i;const track=document.createElement('span');track.className='bar-track';const fill=document.createElement('span');fill.className='bar-fill';fill.style.height=(max>0?100*v/max:0)+'%';track.append(fill);const number=document.createElement('span');number.className='bar-number';number.textContent=fmt(v);button.append(label,track,number);bars.append(button);});
 $('contributionReadout').textContent=`C${b} = ${fmt(r.contributions[b])} · `+t('Teilsumme','Partial sum')+` Σᵦ₌₀…${b} Cᵦ = ${fmt(sum(r.contributions.slice(0,b+1)))} · CMD = ${fmt(r.cmd)}`;
 $('interpretation').textContent=b===0?t('b = 0: Jedes Fenster enthält nur eine Zelle. Deshalb gilt exakt C₀ = L₂².','b = 0: each window contains one cell. Hence C₀ = L₂² exactly.'):b===8?t('b = 8: Jedes Fenster enthält das ganze Gitter. Nur eine Differenz der Gesamtintensitäten bleibt sichtbar: C₈ = 81 (Σf−Σh)².','b = 8: each window contains the entire grid. Only a difference in total intensity remains: C₈ = 81 (Σf−Σh)².'):t('Lokale Summen vergleichen die räumliche Verteilung auf dieser Skala. Differenzen können sich innerhalb eines Fensters aufheben; Intensitätsunterschiede können auch bei großen Fenstern bestehen bleiben.','Local sums compare the spatial distribution at this scale. Differences can cancel within a window; total-intensity differences can persist at large windows.');writeURL();
}
for(const [key] of profileControls)$('edit'+key).addEventListener('input',()=>{state[state.target+key]=Number($('edit'+key).value);state[state.target==='f'?'customF':'customH']=null;update();});
for(const key of ['b','x','y','brush'])$(key).addEventListener('input',()=>{state[key]=Number($(key).value);update();});
for(const key of ['normalize','numbers','paint',...Object.keys(views)])$(key).addEventListener('change',()=>{state[key]=$(key).checked;update();});
$('target').addEventListener('change',()=>{state.target=$('target').value;update();});$('regenerate').addEventListener('click',()=>{state[state.target==='f'?'customF':'customH']=null;update();});
function paint(id){if(!state.paint||!['gridF','gridH'].includes(id))return;const p=id==='gridF'?'f':'h',a=profile(p),i=state.y*N+state.x;a[i]=state.brush===0?0:Math.min(2,Number((a[i]+state.brush).toPrecision(15)));state[p==='f'?'customF':'customH']=a;state.target=p;}
for(const id of ['gridF','gridH','lcdF','lcdH','difference']){$(id).addEventListener('click',e=>{const cell=e.target.closest('[data-index]');if(!cell)return;const i=Number(cell.dataset.index);state.x=i%N;state.y=Math.floor(i/N);paint(id);update();});$(id).addEventListener('keydown',e=>{const moves={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowDown:[0,-1],ArrowUp:[0,1]};if(moves[e.key]){e.preventDefault();state.x+=moves[e.key][0];state.y+=moves[e.key][1];update();}else if(e.key===' '){e.preventDefault();paint(id);update();}});}
$('contributions').addEventListener('click',e=>{const btn=e.target.closest('[data-b]');if(btn){state.b=Number(btn.dataset.b);update();$('contributions').querySelector(`[data-b="${state.b}"]`).focus();}});
$('language').addEventListener('click',()=>{state.lang=state.lang==='de'?'en':'de';update();});$('theme').addEventListener('click',()=>{state.dark=!state.dark;update();});
function reset(){state={...defaults,...viewState(),lang:state.lang,dark:state.dark};update();}$('reset').addEventListener('click',reset);
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();reset();}});
document.querySelectorAll('[data-preset]').forEach(button=>button.addEventListener('click',()=>{state={...defaults,...viewState(),lang:state.lang,dark:state.dark,hx:0};switch(button.dataset.preset){case 'shift':state.hx=2;break;case 'spread':state.hsigma=1.2;break;case 'intensity':state.hmass=1.5;break;case 'noise':state.fsigma=state.hsigma=.8;state.hnoise=.3;break;}update();}));
$('copyLink').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);$('status').textContent=t('Link kopiert.','Link copied.');}catch{$('linkFallback').hidden=false;$('linkFallback').value=location.href;$('linkFallback').select();$('status').textContent=t('Link zum Kopieren auswählen.','Select the link to copy it.');}});
$('save').addEventListener('click',()=>{const doc=document.documentElement.cloneNode(true);doc.querySelector('#initialState').textContent=JSON.stringify(state);doc.querySelector('#status').textContent='';doc.querySelector('#linkFallback').hidden=true;const blob=new Blob(['<!doctype html>\n'+doc.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lcd-cmd-widget.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
update();
})();
</script>
